<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-label="CIA triad with risks and fixes" class="dg"><defs><marker id="ah-cia" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs><text x="380" y="26" text-anchor="middle" class="tt" font-size="17" font-weight="700">The CIA triad: three properties of secure data</text><path d="M 380 80 L 250 236 L 510 236 Z" class="ln"/><rect x="305" y="42" width="150" height="38" rx="8" class="boxb"/><text x="380.0" y="66.0" text-anchor="middle" class="t" font-size="14" font-weight="700">Confidentiality</text><rect x="175" y="236" width="150" height="38" rx="8" class="boxg"/><text x="250.0" y="260.0" text-anchor="middle" class="t" font-size="14" font-weight="700">Integrity</text><rect x="435" y="236" width="150" height="38" rx="8" class="boxy"/><text x="510.0" y="260.0" text-anchor="middle" class="t" font-size="14" font-weight="700">Availability</text><text x="470" y="112" text-anchor="start" class="t" font-size="12">only authorised people can see data</text><text x="470" y="130" text-anchor="start" class="t2" font-size="12">risk: interception, weak passwords</text><text x="470" y="148" text-anchor="start" class="tb" font-size="12">fix: TLS, MFA, access control</text><text x="250" y="300" text-anchor="middle" class="t" font-size="12">data is accurate and unchanged</text><text x="250" y="318" text-anchor="middle" class="t2" font-size="12">risk: manual entry, shared IDs</text><text x="250" y="336" text-anchor="middle" class="tg" font-size="12">fix: validation, audit logs</text><text x="510" y="300" text-anchor="middle" class="t" font-size="12">data and systems usable when needed</text><text x="510" y="318" text-anchor="middle" class="t2" font-size="12">risk: DDoS, hardware failure</text><text x="510" y="336" text-anchor="middle" class="ty" font-size="12">fix: backups, redundancy</text><text x="380" y="368" text-anchor="middle" class="t2" font-size="12">Name the property, the risk from the scenario, then a fix that reduces it.</text></svg>
