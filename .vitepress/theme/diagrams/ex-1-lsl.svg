<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-label="Scatterplot with the least-squares line through the point of means" class="dg"><defs><marker id="ah-ex-1-lsl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs><text x="380" y="24" text-anchor="middle" class="tt" font-size="17" font-weight="700">Example 1: least-squares line y = 2x + 20</text><line x1="60" y1="275" x2="60" y2="55" class="ar" marker-end="url(#ah-ex-1-lsl)"/><line x1="60" y1="275" x2="490" y2="275" class="ar" marker-end="url(#ah-ex-1-lsl)"/><text x="490" y="293" text-anchor="middle" class="t2" font-size="11">x</text><text x="54" y="47" text-anchor="start" class="t2" font-size="11">y</text><line x1="88" y1="249.0" x2="368" y2="197.0" class="lnb"/><circle cx="116" cy="241.2" r="4" class="dot"/><circle cx="172" cy="236.0" r="4" class="dot"/><circle cx="200" cy="225.6" r="4" class="dot"/><circle cx="256" cy="220.4" r="4" class="dot"/><circle cx="284" cy="210.0" r="4" class="dot"/><circle cx="312" cy="212.6" r="4" class="dot"/><circle cx="340" cy="197.0" r="4" class="dot"/><circle cx="228" cy="223.0" r="7" class="dotg"/><text x="238" y="245.0" text-anchor="start" class="tg" font-size="12">(x̄, ȳ) = (10, 40)</text><text x="354.0" y="210.0" text-anchor="start" class="tb" font-size="11">slope 2: +1 in x, +2 in y</text><rect x="520" y="55" width="225" height="200" rx="8" class="box"/><text x="535" y="82" text-anchor="start" class="t" font-size="12">r = 0.8, sₓ = 2, s_y = 5</text><text x="535" y="108" text-anchor="start" class="tb" font-size="12">m = r × s_y ÷ sₓ = 2</text><text x="535" y="134" text-anchor="start" class="tb" font-size="12">c = ȳ − m·x̄ = 40 − 20 = 20</text><text x="535" y="160" text-anchor="start" class="tg" font-size="12">y = 2x + 20</text><text x="535" y="186" text-anchor="start" class="t" font-size="12">R² = 0.8² = 0.64</text><text x="535" y="212" text-anchor="start" class="t2" font-size="12">64% of the variation in y</text><text x="535" y="238" text-anchor="start" class="t2" font-size="12">is explained by x</text><text x="380" y="308" text-anchor="middle" class="t2" font-size="11">The line always passes through the point of means (x̄, ȳ). Dots are illustrative.</text></svg>
