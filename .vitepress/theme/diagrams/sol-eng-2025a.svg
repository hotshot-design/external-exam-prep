<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-label="Thesis and three paragraphs for the reputation prompt" class="dg"><defs><marker id="ah-sol-eng-2025a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs><text x="380" y="24" text-anchor="middle" class="tt" font-size="17" font-weight="700">2025 (a): reputation</text><rect x="20" y="40" width="720" height="38" rx="8" class="boxy"/><text x="34" y="64" text-anchor="start" class="t" font-size="12">What comment does the play make about the importance of reputation?</text><rect x="20" y="90" width="720" height="76" rx="10" class="boxi"/><text x="34" y="112" text-anchor="start" class="ti" font-size="13" font-weight="700">Thesis</text><text x="34" y="132" text-anchor="start" class="t" font-size="12">Reputation is a fragile social currency, easily stolen or counterfeited; those who value</text><text x="34" y="148" text-anchor="start" class="t" font-size="12">appearances over truth, from Cassio to Othello, are most vulnerable.</text><line x1="132" y1="166" x2="132" y2="186" class="arb" marker-end="url(#ah-sol-eng-2025a)"/><rect x="20" y="186" width="230" height="220" rx="8" class="box"/><text x="32" y="208" text-anchor="start" class="tb" font-size="12" font-weight="700">Paragraph 1</text><text x="32" y="228" text-anchor="start" class="tb" font-size="12">Reputation as identity</text><text x="32" y="252" text-anchor="start" class="t" font-size="11">Cassio: “I have lost the</text><text x="32" y="267" text-anchor="start" class="t" font-size="11">immortal part of myself” (2.3):</text><text x="32" y="282" text-anchor="start" class="t" font-size="11">repetition, hyperbole</text><text x="32" y="305" text-anchor="start" class="t2" font-size="11">Context: Venetian military</text><text x="32" y="320" text-anchor="start" class="t2" font-size="11">honour culture</text><line x1="377" y1="166" x2="377" y2="186" class="arb" marker-end="url(#ah-sol-eng-2025a)"/><rect x="265" y="186" width="230" height="220" rx="8" class="box"/><text x="277" y="208" text-anchor="start" class="tb" font-size="12" font-weight="700">Paragraph 2</text><text x="277" y="228" text-anchor="start" class="tb" font-size="12">Iago manipulates reputation</text><text x="277" y="252" text-anchor="start" class="t" font-size="11">“he that filches from me my</text><text x="277" y="267" text-anchor="start" class="t" font-size="11">good name / Robs me of that</text><text x="277" y="282" text-anchor="start" class="t" font-size="11">which not enriches him” (3.3);</text><text x="277" y="297" text-anchor="start" class="t" font-size="11">“honest Iago”</text><text x="277" y="320" text-anchor="start" class="t2" font-size="11">Context: appearance vs reality</text><line x1="622" y1="166" x2="622" y2="186" class="arb" marker-end="url(#ah-sol-eng-2025a)"/><rect x="510" y="186" width="230" height="220" rx="8" class="box"/><text x="522" y="208" text-anchor="start" class="tb" font-size="12" font-weight="700">Paragraph 3</text><text x="522" y="228" text-anchor="start" class="tb" font-size="12">Othello and Desdemona's</text><text x="522" y="244" text-anchor="start" class="tb" font-size="12">names</text><text x="522" y="268" text-anchor="start" class="t" font-size="11">“begrimed and black / As mine</text><text x="522" y="283" text-anchor="start" class="t" font-size="11">own face” (3.3); “Speak of me</text><text x="522" y="298" text-anchor="start" class="t" font-size="11">as I am” (5.2)</text><text x="522" y="321" text-anchor="start" class="t2" font-size="11">Context: an outsider needing</text><text x="522" y="336" text-anchor="start" class="t2" font-size="11">approval writes his own legacy</text></svg>
