<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-label="Thesis and three paragraphs for the Emilia prompt" class="dg"><defs><marker id="ah-sol-eng-2025b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs><text x="380" y="24" text-anchor="middle" class="tt" font-size="17" font-weight="700">2025 (b): Emilia</text><rect x="20" y="40" width="720" height="38" rx="8" class="boxy"/><text x="34" y="64" text-anchor="start" class="t" font-size="12">Analyse the significance of Emilia's character in the play.</text><rect x="20" y="90" width="720" height="76" rx="10" class="boxi"/><text x="34" y="112" text-anchor="start" class="ti" font-size="13" font-weight="700">Thesis</text><text x="34" y="132" text-anchor="start" class="t" font-size="12">Emilia is a foil to Desdemona, the unwitting agent of the handkerchief plot, and the voice that</text><text x="34" y="148" text-anchor="start" class="t" font-size="12">exposes patriarchal double standards and finally destroys Iago with the truth.</text><line x1="132" y1="166" x2="132" y2="186" class="arb" marker-end="url(#ah-sol-eng-2025b)"/><rect x="20" y="186" width="230" height="220" rx="8" class="box"/><text x="32" y="208" text-anchor="start" class="tb" font-size="12" font-weight="700">Paragraph 1</text><text x="32" y="228" text-anchor="start" class="tb" font-size="12">Foil and realist</text><text x="32" y="252" text-anchor="start" class="t" font-size="11">“They are all but stomachs, and</text><text x="32" y="267" text-anchor="start" class="t" font-size="11">we all but food” (3.4):</text><text x="32" y="282" text-anchor="start" class="t" font-size="11">metaphor of consumption</text><text x="32" y="305" text-anchor="start" class="t2" font-size="11">Context: marriage as appetite</text><text x="32" y="320" text-anchor="start" class="t2" font-size="11">and power</text><line x1="377" y1="166" x2="377" y2="186" class="arb" marker-end="url(#ah-sol-eng-2025b)"/><rect x="265" y="186" width="230" height="220" rx="8" class="box"/><text x="277" y="208" text-anchor="start" class="tb" font-size="12" font-weight="700">Paragraph 2</text><text x="277" y="228" text-anchor="start" class="tb" font-size="12">The handkerchief and</text><text x="277" y="244" text-anchor="start" class="tb" font-size="12">complicity</text><text x="277" y="268" text-anchor="start" class="t" font-size="11">takes it “to please his</text><text x="277" y="283" text-anchor="start" class="t" font-size="11">fantasy” (3.3): victim and tool</text><text x="277" y="298" text-anchor="start" class="t" font-size="11">of Iago's control</text><text x="277" y="321" text-anchor="start" class="t2" font-size="11">Context: wifely obedience and</text><text x="277" y="336" text-anchor="start" class="t2" font-size="11">its cost</text><line x1="622" y1="166" x2="622" y2="186" class="arb" marker-end="url(#ah-sol-eng-2025b)"/><rect x="510" y="186" width="230" height="220" rx="8" class="box"/><text x="522" y="208" text-anchor="start" class="tb" font-size="12" font-weight="700">Paragraph 3</text><text x="522" y="228" text-anchor="start" class="tb" font-size="12">Voice of truth</text><text x="522" y="252" text-anchor="start" class="t" font-size="11">“I will not charm my tongue; I</text><text x="522" y="267" text-anchor="start" class="t" font-size="11">am bound to speak” (5.2);</text><text x="522" y="282" text-anchor="start" class="t" font-size="11">“Moor, she was chaste”</text><text x="522" y="305" text-anchor="start" class="t2" font-size="11">Context: defies her husband and</text><text x="522" y="320" text-anchor="start" class="t2" font-size="11">dies for the truth</text></svg>
