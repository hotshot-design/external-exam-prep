<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-label="SWOT matrix of internal and external, helpful and harmful factors" class="dg"><defs><marker id="ah-swot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs><text x="380" y="26" text-anchor="middle" class="tt" font-size="17" font-weight="700">SWOT: classify each case fact</text><text x="260" y="56" text-anchor="middle" class="tg" font-size="13">HELPFUL</text><text x="520" y="56" text-anchor="middle" class="tr" font-size="13">HARMFUL</text><text x="60" y="135" text-anchor="middle" class="tb" font-size="13">INTERNAL</text><text x="60" y="255" text-anchor="middle" class="tb" font-size="13">EXTERNAL</text><rect x="130" y="66" width="255" height="110" rx="8" class="boxg"/><text x="257.5" y="119.0" text-anchor="middle" class="t" font-size="16" font-weight="700">Strengths</text><text x="257.5" y="135.0" text-anchor="middle" class="t2" font-size="13">own resources: partnerships,</text><text x="257" y="158" text-anchor="middle" class="t2" font-size="12">brand, new investment</text><rect x="395" y="66" width="255" height="110" rx="8" class="boxr"/><text x="522.5" y="119.0" text-anchor="middle" class="t" font-size="16" font-weight="700">Weaknesses</text><text x="522.5" y="135.0" text-anchor="middle" class="t2" font-size="13">own limits: low brand awareness,</text><text x="522" y="158" text-anchor="middle" class="t2" font-size="12">no budget, falling profit</text><rect x="130" y="190" width="255" height="110" rx="8" class="boxg"/><text x="257.5" y="243.0" text-anchor="middle" class="t" font-size="16" font-weight="700">Opportunities</text><text x="257.5" y="259.0" text-anchor="middle" class="t2" font-size="13">outside chances: market growth,</text><text x="257" y="282" text-anchor="middle" class="t2" font-size="12">new demand, technology</text><rect x="395" y="190" width="255" height="110" rx="8" class="boxr"/><text x="522.5" y="243.0" text-anchor="middle" class="t" font-size="16" font-weight="700">Threats</text><text x="522.5" y="259.0" text-anchor="middle" class="t2" font-size="13">outside risks: competitors,</text><text x="522" y="282" text-anchor="middle" class="t2" font-size="12">declining sales, regulation</text><text x="380" y="322" text-anchor="middle" class="t2" font-size="12">Internal = S or W (inside the business). External = O or T (outside it). Quote data from the case.</text></svg>
