<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-label="Layout of the Spanish extended-response email" class="dg"><defs><marker id="ah-spanish-email" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs><text x="380" y="26" text-anchor="middle" class="tt" font-size="17" font-weight="700">Section 3 email: 200–300 words in Spanish</text><rect x="180" y="45" width="400" height="335" rx="10" class="box"/><rect x="195" y="58" width="370" height="28" rx="6" class="boxy"/><text x="380.0" y="77.0" text-anchor="middle" class="t" font-size="13">Asunto: …</text><rect x="195" y="94" width="370" height="28" rx="6" class="boxy"/><text x="380.0" y="113.0" text-anchor="middle" class="t" font-size="13">Estimado/a … / ¡Hola, …!</text><rect x="195" y="130" width="370" height="30" rx="6" class="boxb"/><text x="380.0" y="150.0" text-anchor="middle" class="t" font-size="13">Purpose: Le escribo para …</text><rect x="195" y="168" width="370" height="44" rx="6" class="boxg"/><text x="380.0" y="195.0" text-anchor="middle" class="t" font-size="13">Bullet 1: developed paragraph</text><rect x="195" y="220" width="370" height="44" rx="6" class="boxg"/><text x="380.0" y="247.0" text-anchor="middle" class="t" font-size="13">Bullet 2: developed paragraph</text><rect x="195" y="272" width="370" height="44" rx="6" class="boxg"/><text x="380.0" y="299.0" text-anchor="middle" class="t" font-size="13">Bullet 3: developed paragraph</text><rect x="195" y="324" width="370" height="30" rx="6" class="boxy"/><text x="380.0" y="344.0" text-anchor="middle" class="t" font-size="13">Closing + Atentamente / Un saludo + name</text><text x="100" y="120" text-anchor="middle" class="ty" font-size="12"><tspan x="100" y="105.0">greeting +</tspan><tspan x="100" y="120.0">sign-off</tspan><tspan x="100" y="135.0">= 2 marks</tspan></text><text x="660" y="200" text-anchor="middle" class="tg" font-size="12"><tspan x="660" y="185.0">every bullet</tspan><tspan x="660" y="200.0">addressed AND</tspan><tspan x="660" y="215.0">developed</tspan></text><text x="660" y="290" text-anchor="middle" class="tb" font-size="12"><tspan x="660" y="282.5">range of tenses</tspan><tspan x="660" y="297.5">+ one subjunctive</tspan></text></svg>
