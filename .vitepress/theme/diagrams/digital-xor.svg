<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" role="img" aria-label="XOR of plaintext and key bits giving ciphertext" class="dg"><defs><marker id="ah-xor" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs><text x="380" y="26" text-anchor="middle" class="tt" font-size="17" font-weight="700">XOR and the one-time pad</text><text x="110" y="86" text-anchor="end" class="t" font-size="14">plaintext</text><rect x="130" y="60" width="42" height="40" rx="4" class="box"/><text x="151.0" y="85.0" text-anchor="middle" class="t" font-size="16">1</text><rect x="180" y="60" width="42" height="40" rx="4" class="box"/><text x="201.0" y="85.0" text-anchor="middle" class="t" font-size="16">0</text><rect x="230" y="60" width="42" height="40" rx="4" class="box"/><text x="251.0" y="85.0" text-anchor="middle" class="t" font-size="16">1</text><rect x="280" y="60" width="42" height="40" rx="4" class="box"/><text x="301.0" y="85.0" text-anchor="middle" class="t" font-size="16">0</text><text x="110" y="141" text-anchor="end" class="t" font-size="14">key</text><rect x="130" y="115" width="42" height="40" rx="4" class="box"/><text x="151.0" y="140.0" text-anchor="middle" class="t" font-size="16">0</text><rect x="180" y="115" width="42" height="40" rx="4" class="box"/><text x="201.0" y="140.0" text-anchor="middle" class="t" font-size="16">1</text><rect x="230" y="115" width="42" height="40" rx="4" class="box"/><text x="251.0" y="140.0" text-anchor="middle" class="t" font-size="16">1</text><rect x="280" y="115" width="42" height="40" rx="4" class="box"/><text x="301.0" y="140.0" text-anchor="middle" class="t" font-size="16">0</text><text x="110" y="196" text-anchor="end" class="t" font-size="14">ciphertext</text><rect x="130" y="170" width="42" height="40" rx="4" class="boxg"/><text x="151.0" y="195.0" text-anchor="middle" class="t" font-size="16">1</text><rect x="180" y="170" width="42" height="40" rx="4" class="boxg"/><text x="201.0" y="195.0" text-anchor="middle" class="t" font-size="16">1</text><rect x="230" y="170" width="42" height="40" rx="4" class="boxg"/><text x="251.0" y="195.0" text-anchor="middle" class="t" font-size="16">0</text><rect x="280" y="170" width="42" height="40" rx="4" class="boxg"/><text x="301.0" y="195.0" text-anchor="middle" class="t" font-size="16">0</text><line x1="125" y1="170" x2="335" y2="170" class="ln"/><text x="98" y="98" text-anchor="middle" class="t2"></text><text x="360" y="130" text-anchor="start" class="tb" font-size="14">XOR: 1 when the bits differ</text><text x="360" y="155" text-anchor="start" class="t2" font-size="13">same key again restores the plaintext</text><text x="380" y="230" text-anchor="middle" class="t2" font-size="12">One-time pad: key is random, at least as long as the message, and used once.</text><text x="380" y="250" text-anchor="middle" class="t2" font-size="12">Reusing or shortening the key breaks the security.</text></svg>
