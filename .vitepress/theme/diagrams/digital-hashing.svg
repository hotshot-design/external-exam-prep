<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-label="Hash function turning any input into a fixed-length output that cannot be reversed" class="dg"><defs><marker id="ah-hashing" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs><text x="380" y="26" text-anchor="middle" class="tt" font-size="17" font-weight="700">Hashing: one-way, fixed-length output</text><rect x="20" y="60" width="190" height="44" rx="8" class="box"/><text x="115.0" y="87.0" text-anchor="middle" class="t" font-size="13">'hello'</text><line x1="210" y1="82" x2="300" y2="125" class="ar" marker-end="url(#ah-hashing)"/><rect x="20" y="130" width="190" height="44" rx="8" class="box"/><text x="115.0" y="157.0" text-anchor="middle" class="t" font-size="13">'a very long password…'</text><line x1="210" y1="152" x2="300" y2="125" class="ar" marker-end="url(#ah-hashing)"/><rect x="300" y="100" width="140" height="50" rx="8" class="boxb"/><text x="370.0" y="130.0" text-anchor="middle" class="t" font-size="14" font-weight="600">hash function</text><line x1="440" y1="125" x2="530" y2="125" class="ar" marker-end="url(#ah-hashing)"/><rect x="530" y="100" width="200" height="50" rx="8" class="boxg"/><text x="630.0" y="130.0" text-anchor="middle" class="t" font-size="12">5d41402a… (fixed length)</text><path d="M 530 175 L 440 175" class="arr" marker-end="url(#ah-hashing)"/><text x="485" y="195" text-anchor="middle" class="tr" font-size="12">cannot be reversed</text><text x="380" y="245" text-anchor="middle" class="t2" font-size="12">Login: hash the typed password and compare it with the stored hash. Same input → same hash.</text><text x="380" y="265" text-anchor="middle" class="t2" font-size="12">Used for storing passwords (security of data in storage) and for detecting changes (checksum).</text></svg>
