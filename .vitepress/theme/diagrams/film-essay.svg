<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-label="Film exam steps and time split" class="dg"><defs><marker id="ah-film-essay" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs><text x="380" y="26" text-anchor="middle" class="tt" font-size="17" font-weight="700">Film exam: 20 min plan + 120 min write (800–1000 words)</text><rect x="15" y="50" width="235" height="60" rx="8" class="boxb"/><text x="132.5" y="85.0" text-anchor="middle" class="t" font-size="13"><tspan x="132.5" y="76.9">1  Read the 3 questions</tspan><tspan x="132.5" y="93.1">and context boxes</tspan></text><rect x="263" y="50" width="235" height="60" rx="8" class="boxb"/><text x="380.5" y="85.0" text-anchor="middle" class="t" font-size="13"><tspan x="380.5" y="76.9">2  Watch twice;</tspan><tspan x="380.5" y="93.1">list elements</tspan></text><rect x="511" y="50" width="235" height="60" rx="8" class="boxy"/><text x="628.5" y="85.0" text-anchor="middle" class="t" font-size="13"><tspan x="628.5" y="76.9">3  Viewpoint + 3</tspan><tspan x="628.5" y="93.1">interrelationships</tspan></text><rect x="15" y="130" width="235" height="60" rx="8" class="boxg"/><text x="132.5" y="165.0" text-anchor="middle" class="t" font-size="13"><tspan x="132.5" y="156.9">4  Production and</tspan><tspan x="132.5" y="173.1">use contexts</tspan></text><rect x="263" y="130" width="235" height="60" rx="8" class="boxg"/><text x="380.5" y="165.0" text-anchor="middle" class="t" font-size="13"><tspan x="380.5" y="156.9">5  Two to three</tspan><tspan x="380.5" y="173.1">analysis paragraphs</tspan></text><rect x="511" y="130" width="235" height="60" rx="8" class="boxr"/><text x="628.5" y="165.0" text-anchor="middle" class="t" font-size="13"><tspan x="628.5" y="156.9">6  Verdict:</tspan><tspan x="628.5" y="173.1">how effective?</tspan></text><line x1="15" y1="225" x2="255" y2="225" class="lnb"/><text x="135" y="247" text-anchor="middle" class="tb" font-size="12">steps 1–3: 20 minutes planning</text><line x1="260" y1="225" x2="745" y2="225" class="lng"/><text x="500" y="247" text-anchor="middle" class="tg" font-size="12">steps 4–6: 120 minutes writing</text><text x="380" y="285" text-anchor="middle" class="t" font-size="13">Marks (2025): explain contexts 6 · analyse 13 · appraise 10 · written literacy 3</text><text x="380" y="307" text-anchor="middle" class="t2" font-size="12">Every claim needs evidence from the clip, and every paragraph ends with an effectiveness judgment.</text></svg>
