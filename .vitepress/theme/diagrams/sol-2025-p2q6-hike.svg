<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-label="Two lines of distance against time crossing at three hours" class="dg"><defs><marker id="ah-sol-2025-p2q6-hike" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs><text x="380" y="24" text-anchor="middle" class="tt" font-size="17" font-weight="700">2025 Paper 2 Q6: Fiore and Goran meet</text><line x1="70" y1="270" x2="70" y2="60" class="ar" marker-end="url(#ah-sol-2025-p2q6-hike)"/><line x1="70" y1="270" x2="510" y2="270" class="ar" marker-end="url(#ah-sol-2025-p2q6-hike)"/><text x="500" y="290" text-anchor="middle" class="t2" font-size="12">hours n</text><text x="60" y="52" text-anchor="middle" class="t2" font-size="12">km from car park</text><line x1="70" y1="270" x2="470" y2="150" class="lnb"/><line x1="70" y1="90" x2="470" y2="270" class="lnr"/><text x="414.0" y="146.8" text-anchor="middle" class="tb" font-size="12">Fiore F(n) = 2n</text><text x="86.0" y="80" text-anchor="start" class="tr" font-size="12">Goran G(n) = 15 − 3n</text><circle cx="310" cy="198" r="7" class="dotg"/><text x="324" y="162" text-anchor="start" class="tg" font-size="13">meet: n = 3, 6 km</text><line x1="70" y1="270" x2="70" y2="275" class="ln"/><text x="70" y="288" text-anchor="middle" class="t2" font-size="11">0</text><line x1="150" y1="270" x2="150" y2="275" class="ln"/><text x="150" y="288" text-anchor="middle" class="t2" font-size="11">1</text><line x1="230" y1="270" x2="230" y2="275" class="ln"/><text x="230" y="288" text-anchor="middle" class="t2" font-size="11">2</text><line x1="310" y1="270" x2="310" y2="275" class="ln"/><text x="310" y="288" text-anchor="middle" class="t2" font-size="11">3</text><line x1="390" y1="270" x2="390" y2="275" class="ln"/><text x="390" y="288" text-anchor="middle" class="t2" font-size="11">4</text><line x1="470" y1="270" x2="470" y2="275" class="ln"/><text x="470" y="288" text-anchor="middle" class="t2" font-size="11">5</text><rect x="540" y="60" width="200" height="190" rx="8" class="box"/><text x="555" y="90" text-anchor="start" class="t" font-size="13">Meet at 1 pm, rest 30 min</text><text x="555" y="120" text-anchor="start" class="t" font-size="13">resume 1:30 pm</text><text x="555" y="150" text-anchor="start" class="t" font-size="13">arrive 4 pm → 2.5 h</text><text x="555" y="180" text-anchor="start" class="tb" font-size="13">6 km ÷ 2.5 h</text><text x="555" y="210" text-anchor="start" class="tg" font-size="13">= 2.4 km/h</text></svg>
