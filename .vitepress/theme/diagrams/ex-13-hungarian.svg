58" text-anchor="middle" class="tb" font-size="13">After row reduction</text><rect x="270" y="70" width="64" height="44" rx="6" class="box"/><text x="302.0" y="97.0" text-anchor="middle" class="t" font-size="15">7</text><rect x="340" y="70" width="64" height="44" rx="6" class="box"/><text x="372.0" y="97.0" text-anchor="middle" class="t" font-size="15">0</text><rect x="410" y="70" width="64" height="44" rx="6" class="box"/><text x="442.0" y="97.0" text-anchor="middle" class="t" font-size="15">5</text><rect x="270" y="120" width="64" height="44" rx="6" class="box"/><text x="302.0" y="147.0" text-anchor="middle" class="t" font-size="15">3</text><rect x="340" y="120" width="64" height="44" rx="6" class="box"/><text x="372.0" y="147.0" text-anchor="middle" class="t" font-size="15">1</text><rect x="410" y="120" width="64" height="44" rx="6" class="box"/><text x="442.0" y="147.0" text-anchor="middle" class="t" font-size="15">0</text><rect x="270" y="170" width="64" height="44" rx="6" class="box"/><text x="302.0" y="197.0" text-anchor="middle" class="t" font-size="15">4</text><rect x="340" y="170" width="64" height="44" rx="6" class="box"/><text x="372.0" y="197.0" text-anchor="middle" class="t" font-size="15">7</text><rect x="410" y="170" width="64" height="44" rx="6" class="box"/><text x="442.0" y="197.0" text-anchor="middle" class="t" font-size="15">0</text><line x1="484" y1="140" x2="510" y2="140" class="ar" marker-end="url(#ah-ex-13-hungarian)"/><text x="620" y="58" text-anchor="middle" class="tb" font-size="13">After column reduction</text><rect x="515" y="70" width="64" height="44" rx="6" class="box"/><text x="547.0" y="97.0" text-anchor="middle" class="t" font-size="15">4</text><rect x="585" y="70" width="64" height="44" rx="6" class="boxg"/><text x="617.0" y="97.0" text-anchor="middle" class="t" font-size="15">0</text><rect x="655" y="70" width="64" height="44" rx="6" class="box"/><text x="687.0" y="97.0" text-anchor="middle" class="t" font-size="15">5</text><rect x="515" y="120" width="64" height="44" rx="6" class="boxg"/><text x="547.0" y="147.0" text-anchor="middle" class="t" font-size="15">0</text><rect x="585" y="120" width="64" height="44" rx="6" class="box"/><text x="617.0" y="147.0" text-anchor="middle" class="t" font-size="15">1</text><rect x="655" y="120" width="64" height="44" rx="6" class="box"/><text x="687.0" y="147.0" text-anchor="middle" class="t" font-size="15">0</text><rect x="515" y="170" width="64" height="44" rx="6" class="box"/><text x="547.0" y="197.0" text-anchor="middle" class="t" font-size="15">1</text><rect x="585" y="170" width="64" height="44" rx="6" class="box"/><text x="617.0" y="197.0" text-anchor="middle" class="t" font-size="15">7</text><rect x="655" y="170" width="64" height="44" rx="6" class="boxg"/><text x="687.0" y="197.0" text-anchor="middle" class="t" font-size="15">0</text><text x="16" y="98" text-anchor="start" class="t2" font-size="11">W1</text><text x="16" y="148" text-anchor="start" class="t2" font-size="11">W2</text><text x="16" y="198" text-anchor="start" class="t2" font-size="11">W3</text><text x="380" y="250" text-anchor="middle" class="t" font-size="13">Cover the zeros with the fewest lines: 3 lines = n, so assign using the zeros.</text><text x="380" y="275" text-anchor="middle" class="tg" font-size="14">W1 → J2 (2) · W2 → J1 (6) · W3 → J3 (1)   →   minimum total cost = 9</text><text x="380" y="305" text-anchor="middle" class="t2" font-size="11">Row minima 2, 3, 1 are subtracted first; then column 1's minimum (3). Use ORIGINAL costs for the total.</text><text x="380" y="325" text-anchor="middle" class="t2" font-size="11">Maximum problem: subtract every entry from the largest first.</text></svg>
