<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-label="Thesis and three paragraphs for the jealousy prompt" class="dg"><defs><marker id="ah-sol-eng-2024a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs><text x="380" y="24" text-anchor="middle" class="tt" font-size="17" font-weight="700">2024 (a): jealousy</text><rect x="20" y="40" width="720" height="38" rx="8" class="boxy"/><text x="34" y="64" text-anchor="start" class="t" font-size="12">How is the reader invited to view the concept of jealousy in the play?</text><rect x="20" y="90" width="720" height="76" rx="10" class="boxi"/><text x="34" y="112" text-anchor="start" class="ti" font-size="13" font-weight="700">Thesis</text><text x="34" y="132" text-anchor="start" class="t" font-size="12">Jealousy is a self-generating, destructive force that exploits insecurity: born in Iago's</text><text x="34" y="148" text-anchor="start" class="t" font-size="12">resentment, nourished by Othello's need for certainty, fatal to all it touches.</text><line x1="132" y1="166" x2="132" y2="186" class="arb" marker-end="url(#ah-sol-eng-2024a)"/><rect x="20" y="186" width="230" height="220" rx="8" class="box"/><text x="32" y="208" text-anchor="start" class="tb" font-size="12" font-weight="700">Paragraph 1</text><text x="32" y="228" text-anchor="start" class="tb" font-size="12">A manipulated “monster”</text><text x="32" y="252" text-anchor="start" class="t" font-size="11">“the green-eyed monster which</text><text x="32" y="267" text-anchor="start" class="t" font-size="11">doth mock / The meat it feeds</text><text x="32" y="282" text-anchor="start" class="t" font-size="11">on” (3.3): personification,</text><text x="32" y="297" text-anchor="start" class="t" font-size="11">dramatic irony</text><text x="32" y="320" text-anchor="start" class="t2" font-size="11">Context: Jacobean fear of</text><text x="32" y="335" text-anchor="start" class="t2" font-size="11">cuckoldry; honour tied to</text><text x="32" y="350" text-anchor="start" class="t2" font-size="11">chastity</text><line x1="377" y1="166" x2="377" y2="186" class="arb" marker-end="url(#ah-sol-eng-2024a)"/><rect x="265" y="186" width="230" height="220" rx="8" class="box"/><text x="277" y="208" text-anchor="start" class="tb" font-size="12" font-weight="700">Paragraph 2</text><text x="277" y="228" text-anchor="start" class="tb" font-size="12">Jealousy needs no cause</text><text x="277" y="252" text-anchor="start" class="t" font-size="11">“jealous for they are jealous;</text><text x="277" y="267" text-anchor="start" class="t" font-size="11">'tis a monster / Begot upon</text><text x="277" y="282" text-anchor="start" class="t" font-size="11">itself” (3.4); “Trifles light</text><text x="277" y="297" text-anchor="start" class="t" font-size="11">as air” (3.3)</text><text x="277" y="320" text-anchor="start" class="t2" font-size="11">Context: irrationality, not</text><text x="277" y="335" text-anchor="start" class="t2" font-size="11">justice</text><line x1="622" y1="166" x2="622" y2="186" class="arb" marker-end="url(#ah-sol-eng-2024a)"/><rect x="510" y="186" width="230" height="220" rx="8" class="box"/><text x="522" y="208" text-anchor="start" class="tb" font-size="12" font-weight="700">Paragraph 3</text><text x="522" y="228" text-anchor="start" class="tb" font-size="12">Destroys the jealous and the</text><text x="522" y="244" text-anchor="start" class="tb" font-size="12">innocent</text><text x="522" y="268" text-anchor="start" class="t" font-size="11">Othello's fragmented prose</text><text x="522" y="283" text-anchor="start" class="t" font-size="11">(4.1); Desdemona's death; Iago:</text><text x="522" y="298" text-anchor="start" class="t" font-size="11">“'twixt my sheets / He's done</text><text x="522" y="313" text-anchor="start" class="t" font-size="11">my office” (1.3)</text><text x="522" y="336" text-anchor="start" class="t2" font-size="11">Context: pity and judgment of</text><text x="522" y="351" text-anchor="start" class="t2" font-size="11">both men</text></svg>
