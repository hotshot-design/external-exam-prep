<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-label="Planar graph with four faces and Euler's formula" class="dg"><defs><marker id="ah-euler" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs><text x="380" y="26" text-anchor="middle" class="tt" font-size="17" font-weight="700">Planar graphs and Euler's formula</text><line x1="120" y1="200" x2="260" y2="200" class="ln"/><line x1="260" y1="200" x2="260" y2="90" class="ln"/><line x1="260" y1="90" x2="120" y2="90" class="ln"/><line x1="120" y1="90" x2="120" y2="200" class="ln"/><line x1="120" y1="90" x2="190" y2="50" class="ln"/><line x1="190" y1="50" x2="260" y2="90" class="ln"/><line x1="120" y1="200" x2="260" y2="90" class="ln"/><circle cx="120" cy="200" r="14" class="node"/><text x="120" y="205" text-anchor="middle" class="t" font-size="12">1</text><circle cx="260" cy="200" r="14" class="node"/><text x="260" y="205" text-anchor="middle" class="t" font-size="12">2</text><circle cx="260" cy="90" r="14" class="node"/><text x="260" y="95" text-anchor="middle" class="t" font-size="12">3</text><circle cx="120" cy="90" r="14" class="node"/><text x="120" y="95" text-anchor="middle" class="t" font-size="12">4</text><circle cx="190" cy="50" r="14" class="node"/><text x="190" y="55" text-anchor="middle" class="t" font-size="12">5</text><text x="150" y="165" text-anchor="middle" class="tb" font-size="13">f₁</text><text x="235" y="125" text-anchor="middle" class="tb" font-size="13">f₂</text><text x="190" y="80" text-anchor="middle" class="tb" font-size="13">f₃</text><text x="60" y="250" text-anchor="start" class="tb" font-size="13">f₄ (outside)</text><rect x="380" y="60" width="350" height="200" rx="8" class="boxb"/><text x="555" y="90" text-anchor="middle" class="tb" font-size="22">v + f − e = 2</text><text x="555" y="125" text-anchor="middle" class="t2" font-size="13">v vertices, e edges, f faces</text><text x="555" y="160" text-anchor="middle" class="t" font-size="14">This graph: v = 5, e = 7, f = 4</text><text x="555" y="184" text-anchor="middle" class="tg" font-size="14">5 + 4 − 7 = 2 ✓</text><text x="555" y="220" text-anchor="middle" class="t2" font-size="12">Count the outside region as a face.</text><text x="555" y="240" text-anchor="middle" class="t2" font-size="12">Planar = can be drawn with no edges crossing.</text><text x="380" y="300" text-anchor="middle" class="t2" font-size="12">Eulerian circuit: all vertices even. Eulerian trail: exactly two odd vertices.</text></svg>
