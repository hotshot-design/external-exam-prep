<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-label="Bar chart of two years of quarterly sales with seasonal indices" class="dg"><defs><marker id="ah-ex-3-seasonal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs><text x="380" y="24" text-anchor="middle" class="tt" font-size="17" font-weight="700">Example 3: seasonal index and deseasonalising</text><line x1="60" y1="260" x2="60" y2="50" class="ar" marker-end="url(#ah-ex-3-seasonal)"/><line x1="60" y1="260" x2="460" y2="260" class="ar" marker-end="url(#ah-ex-3-seasonal)"/><text x="460" y="278" text-anchor="middle" class="t2" font-size="11">quarter</text><text x="54" y="42" text-anchor="start" class="t2" font-size="11">sales</text><rect x="90" y="172.0" width="36" height="88.0" rx="2" class="boxb"/><rect x="128" y="163.2" width="36" height="96.80000000000001" rx="2" class="boxg"/><text x="108" y="166.0" text-anchor="middle" class="t2" font-size="10">40</text><text x="146" y="157.2" text-anchor="middle" class="t2" font-size="10">44</text><text x="127" y="276" text-anchor="middle" class="t" font-size="12">Q1</text><rect x="185" y="128.0" width="36" height="132.0" rx="2" class="boxb"/><rect x="223" y="114.79999999999998" width="36" height="145.20000000000002" rx="2" class="boxg"/><text x="203" y="122.0" text-anchor="middle" class="t2" font-size="10">60</text><text x="241" y="108.79999999999998" text-anchor="middle" class="t2" font-size="10">66</text><text x="222" y="276" text-anchor="middle" class="t" font-size="12">Q2</text><rect x="280" y="84.0" width="36" height="176.0" rx="2" class="boxb"/><rect x="318" y="66.39999999999998" width="36" height="193.60000000000002" rx="2" class="boxg"/><text x="298" y="78.0" text-anchor="middle" class="t2" font-size="10">80</text><text x="336" y="60.39999999999998" text-anchor="middle" class="t2" font-size="10">88</text><text x="317" y="276" text-anchor="middle" class="t" font-size="12">Q3</text><rect x="375" y="216.0" width="36" height="44.0" rx="2" class="boxb"/><rect x="413" y="211.6" width="36" height="48.400000000000006" rx="2" class="boxg"/><text x="393" y="210.0" text-anchor="middle" class="t2" font-size="10">20</text><text x="431" y="205.6" text-anchor="middle" class="t2" font-size="10">22</text><text x="412" y="276" text-anchor="middle" class="t" font-size="12">Q4</text><rect x="75" y="295" width="12" height="12" rx="2" class="boxb"/><text x="92" y="305" text-anchor="start" class="t2" font-size="11">Year 1 (average 50)</text><rect x="235" y="295" width="12" height="12" rx="2" class="boxg"/><text x="252" y="305" text-anchor="start" class="t2" font-size="11">Year 2 (average 55)</text><rect x="490" y="55" width="255" height="215" rx="8" class="box"/><text x="503" y="82" text-anchor="start" class="tb" font-size="12">Value ÷ year average</text><text x="503" y="110" text-anchor="start" class="t" font-size="12">Q1: 40÷50 = 0.8 · 44÷55 = 0.8</text><text x="503" y="138" text-anchor="start" class="t" font-size="12">Q2: 1.2 · Q3: 1.6 · Q4: 0.4</text><text x="503" y="166" text-anchor="start" class="tb" font-size="12">Seasonal indices (sum = 4):</text><text x="503" y="194" text-anchor="start" class="tg" font-size="12">0.80  1.20  1.60  0.40</text><text x="503" y="222" text-anchor="start" class="tb" font-size="12">Deseasonalise Year 2 Q3:</text><text x="503" y="250" text-anchor="start" class="tg" font-size="12">88 ÷ 1.60 = 55</text></svg>
