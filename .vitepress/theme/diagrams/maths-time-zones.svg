<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-label="Timeline of UTC offsets showing Nagano 17 hours ahead of Santa Cruz" class="dg"><defs><marker id="ah-time-zones" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs><text x="380" y="26" text-anchor="middle" class="tt" font-size="17" font-weight="700">Time zones: east is ahead</text><line x1="40" y1="130" x2="720" y2="130" class="ar" marker-end="url(#ah-time-zones)"/><line x1="40.0" y1="124" x2="40.0" y2="136" class="ln"/><text x="40.0" y="154" text-anchor="middle" class="t2" font-size="11">UTC-12</text><line x1="153.33333333333331" y1="124" x2="153.33333333333331" y2="136" class="ln"/><text x="153.33333333333331" y="154" text-anchor="middle" class="t2" font-size="11">UTC-8</text><line x1="266.66666666666663" y1="124" x2="266.66666666666663" y2="136" class="ln"/><text x="266.66666666666663" y="154" text-anchor="middle" class="t2" font-size="11">UTC-4</text><line x1="380.0" y1="124" x2="380.0" y2="136" class="ln"/><text x="380.0" y="154" text-anchor="middle" class="t2" font-size="11">UTC</text><line x1="493.3333333333333" y1="124" x2="493.3333333333333" y2="136" class="ln"/><text x="493.3333333333333" y="154" text-anchor="middle" class="t2" font-size="11">UTC+4</text><line x1="606.6666666666667" y1="124" x2="606.6666666666667" y2="136" class="ln"/><text x="606.6666666666667" y="154" text-anchor="middle" class="t2" font-size="11">UTC+8</text><line x1="720.0" y1="124" x2="720.0" y2="136" class="ln"/><text x="720.0" y="154" text-anchor="middle" class="t2" font-size="11">UTC+12</text><circle cx="153.33333333333331" cy="130" r="7" class="dot"/><text x="153.33333333333331" y="82" text-anchor="middle" class="tb" font-size="13"><tspan x="153.33333333333331" y="73.9">Santa Cruz</tspan><tspan x="153.33333333333331" y="90.1">UTC−8</tspan></text><circle cx="635.0" cy="130" r="7" class="dotg"/><text x="635.0" y="82" text-anchor="middle" class="tg" font-size="13"><tspan x="635.0" y="73.9">Nagano</tspan><tspan x="635.0" y="90.1">UTC+9</tspan></text><path d="M 153.33333333333331 175 L 635.0 175" class="arb" marker-end="url(#ah-time-zones)"/><text x="394.16666666666663" y="195" text-anchor="middle" class="tb" font-size="13">17 hours apart (9 − (−8))</text><text x="380" y="230" text-anchor="middle" class="t" font-size="14">2:00 pm Monday in Nagano → 9:00 pm Sunday in Santa Cruz</text><text x="380" y="252" text-anchor="middle" class="t2" font-size="12">15° of longitude = 1 hour. Add 1 hour for daylight saving. Watch the date.</text><text x="380" y="272" text-anchor="middle" class="t2" font-size="12">Distance and time together: convert time zones, then use the fraction of the journey (2024 Q7).</text></svg>
