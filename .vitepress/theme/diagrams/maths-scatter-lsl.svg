<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-label="Scatterplot with least-squares line, residuals and interpolation and extrapolation regions" class="dg"><defs><marker id="ah-scatter-lsl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs><text x="380" y="26" text-anchor="middle" class="tt" font-size="17" font-weight="700">Bivariate data: least-squares line, interpolation and extrapolation</text><line x1="60" y1="320" x2="60" y2="70" class="ar" marker-end="url(#ah-scatter-lsl)"/><line x1="60" y1="320" x2="540" y2="320" class="ar" marker-end="url(#ah-scatter-lsl)"/><text x="540" y="338" text-anchor="middle" class="t2" font-size="12">explanatory x</text><text x="50" y="64" text-anchor="middle" class="t2" font-size="12">response y</text><rect x="113.0" y="78" width="319.0" height="242" class="areag"/><rect x="432.0" y="78" width="100.0" height="242" class="arear"/><text x="272.5" y="100" text-anchor="middle" class="tg" font-size="12">interpolation: inside the data (reliable)</text><text x="482.0" y="280" text-anchor="middle" class="tr" font-size="12"><tspan x="482.0" y="272.5">extrapolation:</tspan><tspan x="482.0" y="287.5">outside (risky)</tspan></text><line x1="113.0" y1="261.74" x2="531.0" y2="86.18" class="lnb"/><line x1="135" y1="254.6" x2="135" y2="252.5" class="lnr" stroke-dasharray="5 4"/><circle cx="135" cy="254.6" r="5" class="dot"/><line x1="190" y1="223.10000000000002" x2="190" y2="229.39999999999998" class="lnr" stroke-dasharray="5 4"/><circle cx="190" cy="223.10000000000002" r="5" class="dot"/><line x1="245" y1="216.8" x2="245" y2="206.3" class="lnr" stroke-dasharray="5 4"/><circle cx="245" cy="216.8" r="5" class="dot"/><line x1="300" y1="176.9" x2="300" y2="183.2" class="lnr" stroke-dasharray="5 4"/><circle cx="300" cy="176.9" r="5" class="dot"/><line x1="355" y1="166.4" x2="355" y2="160.1" class="lnr" stroke-dasharray="5 4"/><circle cx="355" cy="166.4" r="5" class="dot"/><line x1="410" y1="130.7" x2="410" y2="137.0" class="lnr" stroke-dasharray="5 4"/><circle cx="410" cy="130.7" r="5" class="dot"/><text x="201.0" y="184.78" text-anchor="middle" class="tb" font-size="13">y = mx + c</text><rect x="560" y="60" width="190" height="250" rx="8" class="box"/><text x="575" y="88" text-anchor="start" class="tb" font-size="13">slope m</text><text x="575" y="105" text-anchor="start" class="t2" font-size="11">change in y for each</text><text x="575" y="119" text-anchor="start" class="t2" font-size="11">1 unit increase in x</text><text x="575" y="146" text-anchor="start" class="tb" font-size="13">intercept c</text><text x="575" y="163" text-anchor="start" class="t2" font-size="11">value of y when x = 0</text><text x="575" y="177" text-anchor="start" class="t2" font-size="11">(if meaningful)</text><text x="575" y="204" text-anchor="start" class="tr" font-size="13">residual</text><text x="575" y="221" text-anchor="start" class="t2" font-size="11">actual − predicted</text><text x="575" y="235" text-anchor="start" class="t2" font-size="11">(the dashed segments)</text><text x="575" y="262" text-anchor="start" class="tb" font-size="13">R²</text><text x="575" y="279" text-anchor="start" class="t2" font-size="11">% of the variation in y</text><text x="575" y="293" text-anchor="start" class="t2" font-size="11">explained by x</text><text x="380" y="366" text-anchor="middle" class="t2" font-size="12">m = r × s_y ÷ s_x and c = ȳ − m·x̄. Association is not causation.</text></svg>
