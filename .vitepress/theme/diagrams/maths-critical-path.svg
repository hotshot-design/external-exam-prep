<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-label="Activity network with earliest and latest start times and the critical path in green" class="dg"><defs><marker id="ah-critical-path" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs><text x="380" y="26" text-anchor="middle" class="tt" font-size="17" font-weight="700">Critical path analysis (forward and backward scan)</text><line x1="145" y1="175" x2="245" y2="115" class="arg" marker-end="url(#ah-critical-path)"/><line x1="145" y1="175" x2="245" y2="230" class="ar" marker-end="url(#ah-critical-path)"/><line x1="305" y1="115" x2="415" y2="175" class="arg" marker-end="url(#ah-critical-path)"/><line x1="305" y1="230" x2="415" y2="175" class="ar" marker-end="url(#ah-critical-path)"/><line x1="475" y1="175" x2="585" y2="175" class="arg" marker-end="url(#ah-critical-path)"/><rect x="90" y="150" width="50" height="50" rx="6" class="boxg"/><text x="115" y="170" text-anchor="middle" class="t" font-size="14" font-weight="700">A</text><text x="115" y="188" text-anchor="middle" class="t2" font-size="11">3 min</text><text x="93" y="144" text-anchor="start" class="tb" font-size="11">EST 0</text><text x="137" y="216" text-anchor="end" class="tr" font-size="11">LST 0</text><rect x="250" y="90" width="50" height="50" rx="6" class="boxg"/><text x="275" y="110" text-anchor="middle" class="t" font-size="14" font-weight="700">B</text><text x="275" y="128" text-anchor="middle" class="t2" font-size="11">4 min</text><text x="253" y="84" text-anchor="start" class="tb" font-size="11">EST 3</text><text x="297" y="156" text-anchor="end" class="tr" font-size="11">LST 3</text><rect x="250" y="205" width="50" height="50" rx="6" class="box"/><text x="275" y="225" text-anchor="middle" class="t" font-size="14" font-weight="700">C</text><text x="275" y="243" text-anchor="middle" class="t2" font-size="11">2 min</text><text x="253" y="199" text-anchor="start" class="tb" font-size="11">EST 3</text><text x="297" y="271" text-anchor="end" class="tr" font-size="11">LST 5</text><rect x="420" y="150" width="50" height="50" rx="6" class="boxg"/><text x="445" y="170" text-anchor="middle" class="t" font-size="14" font-weight="700">D</text><text x="445" y="188" text-anchor="middle" class="t2" font-size="11">5 min</text><text x="423" y="144" text-anchor="start" class="tb" font-size="11">EST 7</text><text x="467" y="216" text-anchor="end" class="tr" font-size="11">LST 7</text><rect x="590" y="150" width="50" height="50" rx="6" class="boxg"/><text x="615" y="170" text-anchor="middle" class="t" font-size="14" font-weight="700">E</text><text x="615" y="188" text-anchor="middle" class="t2" font-size="11">3 min</text><text x="593" y="144" text-anchor="start" class="tb" font-size="11">EST 12</text><text x="637" y="216" text-anchor="end" class="tr" font-size="11">LST 12</text><text x="380" y="312" text-anchor="middle" class="t" font-size="13">Critical path A–B–D–E = 3 + 4 + 5 + 3 = 15 (float 0). C has float 2.</text><text x="380" y="338" text-anchor="middle" class="t2" font-size="12">Forward scan → EST. Backward scan → LST. Float = LST − EST.</text><text x="380" y="360" text-anchor="middle" class="t2" font-size="12">Minimum completion time = the longest path.</text></svg>
