<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-label="Flowchart of the Hungarian algorithm steps" class="dg"><defs><marker id="ah-hungarian" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs><text x="380" y="26" text-anchor="middle" class="tt" font-size="17" font-weight="700">Hungarian algorithm (assignment, minimum cost)</text><rect x="40" y="50" width="200" height="40" rx="8" class="boxb"/><text x="140.0" y="75.0" text-anchor="middle" class="t" font-size="14" font-weight="700">1  Reduce rows</text><rect x="40" y="94" width="200" height="50" rx="6" class="box"/><text x="140.0" y="124.0" text-anchor="middle" class="t" font-size="12"><tspan x="140.0" y="116.5">subtract each row's</tspan><tspan x="140.0" y="131.5">minimum</tspan></text><line x1="240" y1="70" x2="275" y2="70" class="ar" marker-end="url(#ah-hungarian)"/><rect x="275" y="50" width="200" height="40" rx="8" class="boxb"/><text x="375.0" y="75.0" text-anchor="middle" class="t" font-size="14" font-weight="700">2  Reduce columns</text><rect x="275" y="94" width="200" height="50" rx="6" class="box"/><text x="375.0" y="124.0" text-anchor="middle" class="t" font-size="12"><tspan x="375.0" y="116.5">subtract each column's</tspan><tspan x="375.0" y="131.5">minimum</tspan></text><line x1="475" y1="70" x2="510" y2="70" class="ar" marker-end="url(#ah-hungarian)"/><rect x="510" y="50" width="200" height="40" rx="8" class="boxy"/><text x="610.0" y="75.0" text-anchor="middle" class="t" font-size="14" font-weight="700">3  Cover the zeros</text><rect x="510" y="94" width="200" height="50" rx="6" class="box"/><text x="610.0" y="124.0" text-anchor="middle" class="t" font-size="12"><tspan x="610.0" y="116.5">use the fewest lines</tspan><tspan x="610.0" y="131.5">that cover all zeros</tspan></text><line x1="510" y1="144" x2="510" y2="185" class="ar" marker-end="url(#ah-hungarian)"/><rect x="400" y="185" width="220" height="50" rx="8" class="boxy"/><text x="510.0" y="215.0" text-anchor="middle" class="t" font-size="15" font-weight="700">Lines = n ?</text><line x1="620" y1="210" x2="665" y2="210" class="arg" marker-end="url(#ah-hungarian)"/><rect x="665" y="190" width="85" height="40" rx="8" class="boxg"/><text x="707.5" y="215.0" text-anchor="middle" class="t" font-size="12">YES: assign</text><text x="707" y="250" text-anchor="middle" class="tg" font-size="11">using the zeros</text><line x1="400" y1="210" x2="355" y2="210" class="arr" marker-end="url(#ah-hungarian)"/><rect x="40" y="180" width="315" height="60" rx="8" class="boxr"/><text x="197.5" y="215.0" text-anchor="middle" class="t" font-size="11"><tspan x="197.5" y="201.2">NO: subtract the smallest uncovered</tspan><tspan x="197.5" y="215.0">value from uncovered cells, add it to</tspan><tspan x="197.5" y="228.8">doubly covered cells, cover zeros again</tspan></text><path d="M 197 180 L 197 162 L 450 162 L 450 146" class="ar" marker-end="url(#ah-hungarian)"/><text x="380" y="300" text-anchor="middle" class="t" font-size="12">Total cost = add the ORIGINAL values of the assigned cells.</text><text x="380" y="322" text-anchor="middle" class="t2" font-size="12">Maximum problem: subtract every value from the largest first.</text></svg>
