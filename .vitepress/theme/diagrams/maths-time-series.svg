<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-label="Quarterly time series with a rising trend and a repeating seasonal pattern" class="dg"><defs><marker id="ah-time-series" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs><text x="380" y="26" text-anchor="middle" class="tt" font-size="17" font-weight="700">Time series: trend, seasonality and the seasonal index</text><line x1="60" y1="290" x2="60" y2="60" class="ar" marker-end="url(#ah-time-series)"/><line x1="60" y1="290" x2="700" y2="290" class="ar" marker-end="url(#ah-time-series)"/><text x="700" y="308" text-anchor="middle" class="t2" font-size="12">time (quarters)</text><text x="50" y="54" text-anchor="middle" class="t2" font-size="12">value</text><line x1="90" y1="203.0" x2="662" y2="130.39999999999998" class="lnb" stroke-dasharray="5 4"/><polyline points="90.0,226.1 142.0,196.4 194.0,162.7 246.0,183.2 298.0,207.6 350.0,170.0 402.0,128.4 454.0,156.8 506.0,189.1 558.0,143.6 610.0,94.1 662.0,130.4" class="lnr" fill="none"/><circle cx="90" cy="226.1" r="4" class="dotr"/><circle cx="142" cy="196.39999999999998" r="4" class="dotr"/><circle cx="194" cy="162.73999999999998" r="4" class="dotr"/><circle cx="246" cy="183.2" r="4" class="dotr"/><circle cx="298" cy="207.62" r="4" class="dotr"/><circle cx="350" cy="170.0" r="4" class="dotr"/><circle cx="402" cy="128.42" r="4" class="dotr"/><circle cx="454" cy="156.79999999999998" r="4" class="dotr"/><circle cx="506" cy="189.14" r="4" class="dotr"/><circle cx="558" cy="143.6" r="4" class="dotr"/><circle cx="610" cy="94.1" r="4" class="dotr"/><circle cx="662" cy="130.39999999999998" r="4" class="dotr"/><text x="620" y="130.2" text-anchor="middle" class="tb" font-size="12">trend (long-term direction)</text><text x="160" y="75" text-anchor="middle" class="tr" font-size="12"><tspan x="160" y="67.5">seasonality: the pattern repeats</tspan><tspan x="160" y="82.5">every year (4 quarters)</tspan></text><rect x="110" y="318" width="540" height="56" rx="6" class="box"/><text x="380" y="340" text-anchor="middle" class="t" font-size="12">seasonal index = season ÷ that year's average (averaged over years)</text><text x="380" y="360" text-anchor="middle" class="t2" font-size="11">deseasonalised = actual ÷ index. The indices sum to the number of seasons.</text><text x="380" y="392" text-anchor="middle" class="t2" font-size="12">Moving averages smooth the data; irregular (random) fluctuations remain.</text></svg>
