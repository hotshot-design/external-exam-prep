<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-label="Five useability principles and the visual communication elements and principles" class="dg"><defs><marker id="ah-useability" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs><text x="380" y="26" text-anchor="middle" class="tt" font-size="17" font-weight="700">Useability principles and visual communication (syllabus)</text><rect x="10" y="50" width="142" height="40" rx="8" class="boxb"/><text x="81.0" y="75.0" text-anchor="middle" class="t" font-size="13" font-weight="700">Accessibility</text><rect x="10" y="94" width="142" height="62" rx="6" class="box"/><text x="81.0" y="130.0" text-anchor="middle" class="t" font-size="12"><tspan x="81.0" y="115.0">usable by people</tspan><tspan x="81.0" y="130.0">with different</tspan><tspan x="81.0" y="145.0">abilities</tspan></text><rect x="158" y="50" width="142" height="40" rx="8" class="boxg"/><text x="229.0" y="75.0" text-anchor="middle" class="t" font-size="13" font-weight="700">Effectiveness</text><rect x="158" y="94" width="142" height="62" rx="6" class="box"/><text x="229.0" y="130.0" text-anchor="middle" class="t" font-size="12"><tspan x="229.0" y="115.0">tasks completed</tspan><tspan x="229.0" y="130.0">accurately and</tspan><tspan x="229.0" y="145.0">completely</tspan></text><rect x="306" y="50" width="142" height="40" rx="8" class="boxr"/><text x="377.0" y="75.0" text-anchor="middle" class="t" font-size="13" font-weight="700">Safety</text><rect x="306" y="94" width="142" height="62" rx="6" class="box"/><text x="377.0" y="130.0" text-anchor="middle" class="t" font-size="12"><tspan x="377.0" y="115.0">design prevents</tspan><tspan x="377.0" y="130.0">errors and</tspan><tspan x="377.0" y="145.0">harm</tspan></text><rect x="454" y="50" width="142" height="40" rx="8" class="boxy"/><text x="525.0" y="75.0" text-anchor="middle" class="t" font-size="13" font-weight="700">Utility</text><rect x="454" y="94" width="142" height="62" rx="6" class="box"/><text x="525.0" y="130.0" text-anchor="middle" class="t" font-size="12"><tspan x="525.0" y="115.0">has the functions</tspan><tspan x="525.0" y="130.0">needed; adapts to</tspan><tspan x="525.0" y="145.0">different devices</tspan></text><rect x="602" y="50" width="142" height="40" rx="8" class="boxi"/><text x="673.0" y="75.0" text-anchor="middle" class="t" font-size="13" font-weight="700">Learnability</text><rect x="602" y="94" width="142" height="62" rx="6" class="box"/><text x="673.0" y="130.0" text-anchor="middle" class="t" font-size="12"><tspan x="673.0" y="115.0">new users</tspan><tspan x="673.0" y="130.0">learn it</tspan><tspan x="673.0" y="145.0">quickly</tspan></text><rect x="20" y="175" width="340" height="110" rx="8" class="box"/><text x="190" y="197" text-anchor="middle" class="tb" font-size="13">Elements of visual communication</text><text x="190" y="232" text-anchor="middle" class="t" font-size="13"><tspan x="190" y="223.9">space · line · colour · shape · texture</tspan><tspan x="190" y="240.1">tone · form · proportion · scale</tspan></text><rect x="400" y="175" width="340" height="110" rx="8" class="box"/><text x="570" y="197" text-anchor="middle" class="tg" font-size="13">Principles of visual communication</text><text x="570" y="232" text-anchor="middle" class="t" font-size="13"><tspan x="570" y="223.9">balance · contrast · proximity · harmony</tspan><tspan x="570" y="240.1">alignment · repetition · hierarchy</tspan></text><text x="380" y="315" text-anchor="middle" class="t2" font-size="12">Evaluate a UI with two useability principles: name each, then justify with evidence from the screen.</text></svg>
