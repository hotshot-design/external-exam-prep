<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-label="Force field analysis with forces for and against change" class="dg"><defs><marker id="ah-force-field" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs><text x="380" y="28" text-anchor="middle" class="tt" font-size="17" font-weight="700">Force field analysis (example: Music Co, 2025)</text><line x1="380" y1="50" x2="380" y2="300" class="lnb"/><rect x="300" y="305" width="160" height="28" rx="8" class="boxb"/><text x="380.0" y="324.0" text-anchor="middle" class="tb" font-size="13">THE CHANGE</text><text x="135" y="62" text-anchor="middle" class="tg" font-size="14">FORCES FOR change</text><text x="625" y="62" text-anchor="middle" class="tr" font-size="14">FORCES AGAINST change</text><rect x="20" y="78" width="230" height="56" rx="8" class="boxg"/><text x="135.0" y="111.0" text-anchor="middle" class="t" font-size="12"><tspan x="135.0" y="103.5">2 600 searches a month for</tspan><tspan x="135.0" y="118.5">'where to upload music demo'</tspan></text><line x1="252" y1="106" x2="372" y2="106" class="arg" marker-end="url(#ah-force-field)"/><rect x="20" y="168" width="230" height="56" rx="8" class="boxg"/><text x="135.0" y="201.0" text-anchor="middle" class="t" font-size="12"><tspan x="135.0" y="193.5">Streaming forecast to grow</tspan><tspan x="135.0" y="208.5">to $4 billion by 2034</tspan></text><line x1="252" y1="196" x2="372" y2="196" class="arg" marker-end="url(#ah-force-field)"/><rect x="510" y="78" width="230" height="56" rx="8" class="boxr"/><text x="625.0" y="111.0" text-anchor="middle" class="t" font-size="12"><tspan x="625.0" y="103.5">R&amp;D about $1 million;</tspan><tspan x="625.0" y="118.5">streaming about $1.5 million</tspan></text><line x1="508" y1="106" x2="388" y2="106" class="arr" marker-end="url(#ah-force-field)"/><rect x="510" y="168" width="230" height="56" rx="8" class="boxr"/><text x="625.0" y="201.0" text-anchor="middle" class="t" font-size="12"><tspan x="625.0" y="193.5">Expenses rising for five years,</tspan><tspan x="625.0" y="208.5">against the 20% profit goal</tspan></text><line x1="508" y1="196" x2="388" y2="196" class="arr" marker-end="url(#ah-force-field)"/><text x="380" y="290" text-anchor="middle" class="t2"></text><text x="190" y="292" text-anchor="middle" class="t2" font-size="12">Weigh each force's strength, then decide</text><text x="580" y="292" text-anchor="middle" class="t2" font-size="12">and propose ONE action (e.g. a cost-benefit analysis)</text></svg>
