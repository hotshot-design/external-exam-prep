<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-label="Three sections of the Spanish exam" class="dg"><defs><marker id="ah-spanish-exam" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs><text x="380" y="26" text-anchor="middle" class="tt" font-size="17" font-weight="700">Spanish exam: three sections (2024–25)</text><rect x="20" y="55" width="225" height="40" rx="8" class="boxb"/><text x="132.5" y="80.0" text-anchor="middle" class="t" font-size="15" font-weight="700">Section 1</text><rect x="20" y="100" width="225" height="120" rx="8" class="box"/><text x="132" y="125" text-anchor="middle" class="t" font-size="12" font-weight="600">audio · answer in SPANISH</text><text x="132" y="150" text-anchor="middle" class="tb" font-size="13">14–15 marks</text><text x="132" y="186" text-anchor="middle" class="t2" font-size="11"><tspan x="132" y="179.1">context, purpose, tone...</tspan><tspan x="132" y="192.9">'conclusion + N examples'</tspan></text><rect x="265" y="55" width="225" height="40" rx="8" class="boxg"/><text x="377.5" y="80.0" text-anchor="middle" class="t" font-size="15" font-weight="700">Section 2</text><rect x="265" y="100" width="225" height="120" rx="8" class="box"/><text x="377" y="125" text-anchor="middle" class="t" font-size="12" font-weight="600">two texts · answer in ENGLISH</text><text x="377" y="150" text-anchor="middle" class="tb" font-size="13">17 marks</text><text x="377" y="186" text-anchor="middle" class="t2" font-size="11"><tspan x="377" y="179.1">audience, perspective,</tspan><tspan x="377" y="192.9">purpose, tone</tspan></text><rect x="510" y="55" width="225" height="40" rx="8" class="boxy"/><text x="622.5" y="80.0" text-anchor="middle" class="t" font-size="15" font-weight="700">Section 3</text><rect x="510" y="100" width="225" height="120" rx="8" class="box"/><text x="622" y="125" text-anchor="middle" class="t" font-size="12" font-weight="600">email in SPANISH</text><text x="622" y="150" text-anchor="middle" class="tb" font-size="13">21 marks</text><text x="622" y="186" text-anchor="middle" class="t2" font-size="11"><tspan x="622" y="179.1">200–300 words, 3 bullets</tspan><tspan x="622" y="192.9">greeting + sign-off</tspan></text><text x="380" y="250" text-anchor="middle" class="t2" font-size="12">5 min perusal + 120 min. The audio can be replayed as often as you need.</text><text x="380" y="272" text-anchor="middle" class="t2" font-size="12">Total 52–53 marks. Writing Section 3 in English scores 0.</text></svg>
