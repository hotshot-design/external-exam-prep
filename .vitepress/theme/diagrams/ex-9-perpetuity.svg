<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" role="img" aria-label="Principal earns interest which is paid out, leaving the principal unchanged" class="dg"><defs><marker id="ah-ex-9-perpetuity" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs><text x="380" y="24" text-anchor="middle" class="tt" font-size="17" font-weight="700">Example 9: perpetuity, $500 a quarter at 4% p.a. (quarterly)</text><rect x="40" y="95" width="200" height="80" rx="8" class="boxb"/><text x="140.0" y="140.0" text-anchor="middle" class="t" font-size="16" font-weight="700"><tspan x="140.0" y="130.0">Principal</tspan><tspan x="140.0" y="150.0">$50 000</tspan></text><rect x="330" y="95" width="190" height="80" rx="8" class="boxy"/><text x="425.0" y="140.0" text-anchor="middle" class="t" font-size="13"><tspan x="425.0" y="131.9">Interest each quarter</tspan><tspan x="425.0" y="148.1">1% × 50 000 = $500</tspan></text><rect x="600" y="95" width="140" height="80" rx="8" class="boxg"/><text x="670.0" y="140.0" text-anchor="middle" class="t" font-size="15" font-weight="700"><tspan x="670.0" y="130.6">Payment</tspan><tspan x="670.0" y="149.4">$500</tspan></text><line x1="240" y1="135" x2="330" y2="135" class="arb" marker-end="url(#ah-ex-9-perpetuity)"/><line x1="520" y1="135" x2="600" y2="135" class="arg" marker-end="url(#ah-ex-9-perpetuity)"/><text x="380" y="215" text-anchor="middle" class="t" font-size="12">The payment is only the interest, so the principal never shrinks and the payments continue forever.</text><text x="380" y="237" text-anchor="middle" class="tb" font-size="13">A = d ÷ i = 500 ÷ 0.01 = $50 000      (i = 0.04 ÷ 4 = 0.01 per quarter)</text></svg>
