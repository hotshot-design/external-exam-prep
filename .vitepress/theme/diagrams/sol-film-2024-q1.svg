<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-label="Mind map of context facts and what to analyse for the Silent question" class="dg"><defs><marker id="ah-sol-film-2024-q1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs><text x="380" y="24" text-anchor="middle" class="tt" font-size="17" font-weight="700">2024 Q1 Representations: Silent (Moonbot, Dolby)</text><rect x="190" y="40" width="380" height="34" rx="8" class="boxy"/><text x="380.0" y="62.0" text-anchor="middle" class="t" font-size="13" font-weight="700">Key concept: representations</text><rect x="20" y="90" width="235" height="190" rx="8" class="boxb"/><text x="32" y="112" text-anchor="start" class="tb" font-size="13" font-weight="700">Context of production</text><text x="32" y="132" text-anchor="start" class="t" font-size="12">Moonbot Studios with Dolby;</text><text x="32" y="148" text-anchor="start" class="t" font-size="12">sound by Steve Boeddeker.</text><text x="32" y="164" text-anchor="start" class="t" font-size="12">Purpose: show the evolution</text><text x="32" y="180" text-anchor="start" class="t" font-size="12">of film technology and the</text><text x="32" y="196" text-anchor="start" class="t" font-size="12">emotional power of audio.</text><text x="32" y="212" text-anchor="start" class="t" font-size="12">Morris Lessmore and The Kid</text><text x="32" y="228" text-anchor="start" class="t" font-size="12">represent picture and sound.</text><rect x="262" y="90" width="235" height="190" rx="8" class="boxg"/><text x="274" y="112" text-anchor="start" class="tg" font-size="13" font-weight="700">Context of use</text><text x="274" y="132" text-anchor="start" class="t" font-size="12">Debuted at the Scientific and</text><text x="274" y="148" text-anchor="start" class="t" font-size="12">Technical Academy Awards (15</text><text x="274" y="164" text-anchor="start" class="t" font-size="12">Feb 2014): industry and</text><text x="274" y="180" text-anchor="start" class="t" font-size="12">technical experts. (Inferred:</text><text x="274" y="196" text-anchor="start" class="t" font-size="12">promotes Dolby sound.)</text><rect x="504" y="90" width="236" height="190" rx="8" class="box"/><text x="516" y="112" text-anchor="start" class="tr" font-size="13" font-weight="700">Analyse after watching</text><text x="516" y="132" text-anchor="start" class="t" font-size="12">How each character's design,</text><text x="516" y="148" text-anchor="start" class="t" font-size="12">movement and sound work</text><text x="516" y="164" text-anchor="start" class="t" font-size="12">together, and how the</text><text x="516" y="180" text-anchor="start" class="t" font-size="12">relationship between picture</text><text x="516" y="196" text-anchor="start" class="t" font-size="12">and sound is shown.</text><line x1="137" y1="280" x2="137" y2="305" class="arb" marker-end="url(#ah-sol-film-2024-q1)"/><line x1="380" y1="280" x2="380" y2="305" class="arg" marker-end="url(#ah-sol-film-2024-q1)"/><line x1="622" y1="280" x2="622" y2="305" class="arr" marker-end="url(#ah-sol-film-2024-q1)"/><rect x="20" y="305" width="720" height="75" rx="10" class="boxi"/><text x="36" y="330" text-anchor="start" class="ti" font-size="13" font-weight="700">Viewpoint (appraise)</text><text x="36" y="352" text-anchor="start" class="t" font-size="12">The characters are an effective/ingenious/limited representation of picture and sound because …</text></svg>
