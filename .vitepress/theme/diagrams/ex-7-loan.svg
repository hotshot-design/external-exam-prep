<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-label="Loan balance falling to zero over sixty months" class="dg"><defs><marker id="ah-ex-7-loan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs><text x="380" y="24" text-anchor="middle" class="tt" font-size="17" font-weight="700">Example 7: $20 000 loan, 7.2% p.a., monthly over 5 years</text><line x1="70" y1="270" x2="70" y2="60" class="ar" marker-end="url(#ah-ex-7-loan)"/><line x1="70" y1="270" x2="490" y2="270" class="ar" marker-end="url(#ah-ex-7-loan)"/><text x="490" y="288" text-anchor="middle" class="t2" font-size="11">months</text><text x="64" y="52" text-anchor="start" class="t2" font-size="11">balance ($)</text><polyline points="85.0,70.0 91.4,72.6 97.8,75.3 104.2,78.0 110.6,80.7 117.0,83.4 123.4,86.1 129.8,88.8 136.2,91.6 142.6,94.3 149.0,97.1 155.4,99.9 161.8,102.7 168.2,105.6 174.6,108.4 181.0,111.3 187.4,114.2 193.8,117.1 200.2,120.0 206.6,123.0 213.0,125.9 219.4,128.9 225.8,131.9 232.2,134.9 238.6,137.9 245.0,141.0 251.4,144.0 257.8,147.1 264.2,150.2 270.6,153.4 277.0,156.5 283.4,159.7 289.8,162.8 296.2,166.0 302.6,169.2 309.0,172.5 315.4,175.7 321.8,179.0 328.2,182.3 334.6,185.6 341.0,189.0 347.4,192.3 353.8,195.7 360.2,199.1 366.6,202.5 373.0,205.9 379.4,209.4 385.8,212.9 392.2,216.4 398.6,219.9 405.0,223.4 411.4,227.0 417.8,230.6 424.2,234.2 430.6,237.8 437.0,241.4 443.4,245.1 449.8,248.8 456.2,252.5 462.6,256.2 469.0,260.0" class="lnb" fill="none"/><circle cx="85.0" cy="70.0" r="5" class="dot"/><circle cx="469.0" cy="259.9999999999996" r="5" class="dotg"/><text x="97.0" y="86.0" text-anchor="start" class="t2" font-size="11">$20 000</text><text x="469.0" y="247.9999999999996" text-anchor="middle" class="tg" font-size="12">≈ $0</text><rect x="520" y="55" width="225" height="195" rx="8" class="box"/><text x="535" y="82" text-anchor="start" class="t" font-size="13">i = 0.006, n = 60</text><text x="535" y="110" text-anchor="start" class="tb" font-size="13">d = P·i ÷ (1 − (1+i)⁻ⁿ)</text><text x="535" y="138" text-anchor="start" class="tg" font-size="13">≈ $397.91 per month</text><text x="535" y="166" text-anchor="start" class="t" font-size="13">repaid ≈ $23,874.83</text><text x="535" y="194" text-anchor="start" class="t" font-size="13">interest ≈ $3,874.83</text><text x="535" y="222" text-anchor="start" class="t2" font-size="13">(from the unrounded payment)</text><text x="380" y="305" text-anchor="middle" class="t2" font-size="11">Each month the interest is added, then the repayment is taken off.</text></svg>
