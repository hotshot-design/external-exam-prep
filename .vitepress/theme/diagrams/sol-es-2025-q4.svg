<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-label="Two perspectives with two examples each for the 2025 Q4 answer" class="dg"><defs><marker id="ah-sol-es-2025-q4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs><text x="380" y="24" text-anchor="middle" class="tt" font-size="17" font-weight="700">2025 Q4: two perspectives in Stimulus 2 (6 marks)</text><rect x="20" y="40" width="720" height="40" rx="8" class="boxy"/><text x="34" y="64" text-anchor="start" class="t" font-size="12">Two perspectives, each with two examples (3 marks each).</text><rect x="110" y="100" width="540" height="60" rx="10" class="boxb"/><text x="126" y="122" text-anchor="start" class="tb" font-size="13" font-weight="700">Conclusion (1 mark)</text><text x="126" y="142" text-anchor="start" class="t" font-size="12">P1 embracing change is beneficial; P2 keep learning.</text><line x1="105.5" y1="160" x2="105.5" y2="186" class="arb" marker-end="url(#ah-sol-es-2025-q4)"/><rect x="20.0" y="186" width="171.0" height="90" rx="8" class="boxg"/><text x="30.0" y="206" text-anchor="start" class="tg" font-size="12" font-weight="700">Example 1 (1)</text><text x="30.0" y="224" text-anchor="start" class="t" font-size="11">P1: changed plans,</text><text x="30.0" y="239" text-anchor="start" class="t" font-size="11">worked and travelled</text><text x="30.0" y="254" text-anchor="start" class="t" font-size="11">in Mexico instead of</text><text x="30.0" y="269" text-anchor="start" class="t" font-size="11">university.</text><line x1="288.5" y1="160" x2="288.5" y2="186" class="arb" marker-end="url(#ah-sol-es-2025-q4)"/><rect x="203.0" y="186" width="171.0" height="90" rx="8" class="boxg"/><text x="213.0" y="206" text-anchor="start" class="tg" font-size="12" font-weight="700">Example 2 (1)</text><text x="213.0" y="224" text-anchor="start" class="t" font-size="11">P1: “¿a qué esperan?”</text><text x="213.0" y="239" text-anchor="start" class="t" font-size="11">challenges readers to</text><text x="213.0" y="254" text-anchor="start" class="t" font-size="11">start their next</text><text x="213.0" y="269" text-anchor="start" class="t" font-size="11">adventure.</text><line x1="471.5" y1="160" x2="471.5" y2="186" class="arb" marker-end="url(#ah-sol-es-2025-q4)"/><rect x="386.0" y="186" width="171.0" height="90" rx="8" class="boxg"/><text x="396.0" y="206" text-anchor="start" class="tg" font-size="12" font-weight="700">Example 3 (1)</text><text x="396.0" y="224" text-anchor="start" class="t" font-size="11">P2: promotes</text><text x="396.0" y="239" text-anchor="start" class="t" font-size="11">university and other</text><text x="396.0" y="254" text-anchor="start" class="t" font-size="11">courses.</text><line x1="654.5" y1="160" x2="654.5" y2="186" class="arb" marker-end="url(#ah-sol-es-2025-q4)"/><rect x="569.0" y="186" width="171.0" height="90" rx="8" class="boxg"/><text x="579.0" y="206" text-anchor="start" class="tg" font-size="12" font-weight="700">Example 4 (1)</text><text x="579.0" y="224" text-anchor="start" class="t" font-size="11">P2: dance class and</text><text x="579.0" y="239" text-anchor="start" class="t" font-size="11">volleyball team,</text><text x="579.0" y="254" text-anchor="start" class="t" font-size="11">enjoyed though not</text><text x="579.0" y="269" text-anchor="start" class="t" font-size="11">careers.</text><text x="380" y="306" text-anchor="middle" class="t2" font-size="11">Each perspective: 1 mark + 1 per example. Another valid one: value independence.</text></svg>
