<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-label="SWOT matrix filled with Music Co case facts" class="dg"><defs><marker id="ah-sol-2025-swot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs><text x="380" y="24" text-anchor="middle" class="tt" font-size="17" font-weight="700">2025 report: SWOT for Music Co (case facts)</text><rect x="30" y="45" width="335" height="140" rx="8" class="boxg"/><text x="197" y="69" text-anchor="middle" class="tg" font-size="15">Strengths</text><text x="44" y="100" text-anchor="start" class="t" font-size="12">• Strongest industry partnerships (score 9, S6)</text><text x="44" y="126" text-anchor="start" class="t" font-size="12">• Established retailer, 26% market share (S7)</text><text x="44" y="152" text-anchor="start" class="t" font-size="12">• Streaming already offered to customers (S4)</text><rect x="395" y="45" width="335" height="140" rx="8" class="boxr"/><text x="562" y="69" text-anchor="middle" class="tr" font-size="15">Weaknesses</text><text x="409" y="100" text-anchor="start" class="t" font-size="12">• Lowest brand awareness (4, S6)</text><text x="409" y="126" text-anchor="start" class="t" font-size="12">• Total USP score 28 trails rivals (S6)</text><text x="409" y="152" text-anchor="start" class="t" font-size="12">• Expenses rising, profit falling (S2)</text><rect x="30" y="195" width="335" height="140" rx="8" class="boxg"/><text x="197" y="219" text-anchor="middle" class="tg" font-size="15">Opportunities</text><text x="44" y="250" text-anchor="start" class="t" font-size="12">• Streaming revenue forecast to grow (S9)</text><text x="44" y="276" text-anchor="start" class="t" font-size="12">• 2 600 searches a month to upload demos (S10)</text><text x="44" y="302" text-anchor="start" class="t" font-size="12">• Content creation hubs growing (S8)</text><rect x="395" y="195" width="335" height="140" rx="8" class="boxr"/><text x="562" y="219" text-anchor="middle" class="tr" font-size="15">Threats</text><text x="409" y="250" text-anchor="start" class="t" font-size="12">• Physical sales declining (S7, S9)</text><text x="409" y="276" text-anchor="start" class="t" font-size="12">• Rivals score higher on USPs (S6)</text><text x="409" y="302" text-anchor="start" class="t" font-size="12">• R&amp;D ~$1 million, streaming ~$1.5 million (S7)</text><text x="380" y="350" text-anchor="middle" class="t2" font-size="12">Internal = S/W (top). External = O/T (bottom). Cite stimulus numbers.</text></svg>
