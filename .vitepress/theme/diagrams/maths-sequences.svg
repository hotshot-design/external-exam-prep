<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-label="Straight-line arithmetic growth compared with curved geometric growth" class="dg"><defs><marker id="ah-sequences" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs><text x="380" y="26" text-anchor="middle" class="tt" font-size="17" font-weight="700">Arithmetic vs geometric sequences</text><line x1="60" y1="290" x2="60" y2="60" class="ar" marker-end="url(#ah-sequences)"/><line x1="60" y1="290" x2="420" y2="290" class="ar" marker-end="url(#ah-sequences)"/><text x="420" y="308" text-anchor="middle" class="t2" font-size="12">n</text><text x="50" y="54" text-anchor="middle" class="t2" font-size="12">t(n)</text><circle cx="90" cy="231.0" r="5" class="dot"/><circle cx="90" cy="259.6" r="5" class="dotr"/><circle cx="135" cy="215.4" r="5" class="dot"/><circle cx="135" cy="254.4" r="5" class="dotr"/><circle cx="180" cy="199.8" r="5" class="dot"/><circle cx="180" cy="246.6" r="5" class="dotr"/><circle cx="225" cy="184.2" r="5" class="dot"/><circle cx="225" cy="234.9" r="5" class="dotr"/><circle cx="270" cy="168.6" r="5" class="dot"/><circle cx="270" cy="217.35" r="5" class="dotr"/><circle cx="315" cy="153.0" r="5" class="dot"/><circle cx="315" cy="191.02499999999998" r="5" class="dotr"/><circle cx="360" cy="137.4" r="5" class="dot"/><circle cx="360" cy="151.5375" r="5" class="dotr"/><circle cx="405" cy="121.79999999999998" r="5" class="dot"/><circle cx="405" cy="92.30625" r="5" class="dotr"/><polyline points="90.0,231.0 135.0,215.4 180.0,199.8 225.0,184.2 270.0,168.6 315.0,153.0 360.0,137.4 405.0,121.8" class="lnb" fill="none"/><polyline points="90.0,259.6 135.0,254.4 180.0,246.6 225.0,234.9 270.0,217.3 315.0,191.0 360.0,151.5 405.0,92.3" class="lnr" fill="none"/><rect x="450" y="60" width="290" height="110" rx="8" class="boxb"/><text x="595" y="82" text-anchor="middle" class="tb" font-size="14">Arithmetic (linear)</text><text x="595" y="108" text-anchor="middle" class="t" font-size="13">constant difference d</text><text x="595" y="130" text-anchor="middle" class="t" font-size="14">t(n) = t₁ + (n − 1)d</text><text x="595" y="152" text-anchor="middle" class="t2" font-size="12">flat-rate depreciation</text><rect x="450" y="185" width="290" height="110" rx="8" class="boxr"/><text x="595" y="207" text-anchor="middle" class="tr" font-size="14">Geometric (exponential)</text><text x="595" y="233" text-anchor="middle" class="t" font-size="13">constant ratio r</text><text x="595" y="255" text-anchor="middle" class="t" font-size="14">t(n) = t₁ · r^(n−1)</text><text x="595" y="277" text-anchor="middle" class="t2" font-size="12">r &gt; 1 growth, r &lt; 1 decay</text><text x="380" y="325" text-anchor="middle" class="t2" font-size="12">Define n carefully: if 2012 is term 1, the start of 2021 is term 10.</text></svg>
