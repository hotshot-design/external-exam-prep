<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-label="Weighted graph with the minimum spanning tree highlighted" class="dg"><defs><marker id="ah-mst" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs><text x="380" y="26" text-anchor="middle" class="tt" font-size="17" font-weight="700">Minimum spanning tree (Kruskal's algorithm)</text><line x1="96.12761606685874" y1="114.62412797771375" x2="213.87238393314126" y2="75.37587202228625" class="ln"/><rect x="142.0" y="85.0" width="26" height="20" rx="4" class="box"/><text x="155.0" y="100.0" text-anchor="middle" class="t" font-size="12">4</text><line x1="95.40511337991951" y1="127.1890529106291" x2="214.5948866200805" y2="182.8109470893709" class="ln"/><rect x="142.0" y="145.0" width="26" height="20" rx="4" class="box"/><text x="155.0" y="160.0" text-anchor="middle" class="t" font-size="12">6</text><line x1="230.0" y1="87.0" x2="230.0" y2="173.0" class="ln"/><rect x="217.0" y="120.0" width="26" height="20" rx="4" class="box"/><text x="230.0" y="135.0" text-anchor="middle" class="t" font-size="12">3</text><line x1="246.22615962659552" y1="75.0706748833111" x2="373.7738403734045" y2="114.9293251166889" class="ln"/><rect x="297.0" y="85.0" width="26" height="20" rx="4" class="box"/><text x="310.0" y="100.0" text-anchor="middle" class="t" font-size="12">7</text><line x1="245.57467469333722" y1="183.18607982166498" x2="374.4253253066628" y2="126.81392017833502" class="ln"/><rect x="297.0" y="145.0" width="26" height="20" rx="4" class="box"/><text x="310.0" y="160.0" text-anchor="middle" class="t" font-size="12">5</text><line x1="245.91759601867375" y1="195.96909850700266" x2="374.08240398132625" y2="244.03090149299734" class="ln"/><rect x="297.0" y="210.0" width="26" height="20" rx="4" class="box"/><text x="310.0" y="225.0" text-anchor="middle" class="t" font-size="12">8</text><line x1="390.0" y1="137.0" x2="390.0" y2="233.0" class="ln"/><rect x="377.0" y="175.0" width="26" height="20" rx="4" class="box"/><text x="390.0" y="190.0" text-anchor="middle" class="t" font-size="12">4</text><line x1="80.0" y1="137.0" x2="80.0" y2="233.0" class="ln"/><rect x="67.0" y="175.0" width="26" height="20" rx="4" class="box"/><text x="80.0" y="190.0" text-anchor="middle" class="t" font-size="12">9</text><line x1="214.2158962549506" y1="196.31364149801976" x2="95.7841037450494" y2="243.68635850198024" class="ln"/><rect x="142.0" y="210.0" width="26" height="20" rx="4" class="box"/><text x="155.0" y="225.0" text-anchor="middle" class="t" font-size="12">6</text><line x1="373.0" y1="250.0" x2="97.0" y2="250.0" class="ln"/><rect x="222.0" y="240.0" width="26" height="20" rx="4" class="box"/><text x="235.0" y="255.0" text-anchor="middle" class="t" font-size="12">10</text><circle cx="80" cy="120" r="17" class="nodeb"/><text x="80" y="125" text-anchor="middle" class="t" font-size="13" font-weight="600">A</text><circle cx="230" cy="70" r="17" class="nodeb"/><text x="230" y="75" text-anchor="middle" class="t" font-size="13" font-weight="600">B</text><circle cx="230" cy="190" r="17" class="nodeb"/><text x="230" y="195" text-anchor="middle" class="t" font-size="13" font-weight="600">C</text><circle cx="390" cy="120" r="17" class="nodeb"/><text x="390" y="125" text-anchor="middle" class="t" font-size="13" font-weight="600">D</text><circle cx="390" cy="250" r="17" class="nodeb"/><text x="390" y="255" text-anchor="middle" class="t" font-size="13" font-weight="600">E</text><circle cx="80" cy="250" r="17" class="nodeb"/><text x="80" y="255" text-anchor="middle" class="t" font-size="13" font-weight="600">F</text><rect x="480" y="55" width="260" height="240" rx="8" class="box"/><text x="610" y="80" text-anchor="middle" class="tb" font-size="14">Kruskal steps</text><text x="495" y="112" text-anchor="start" class="t" font-size="12">1. List edges shortest first</text><text x="495" y="138" text-anchor="start" class="t" font-size="12">2. Add the next shortest edge</text><text x="495" y="164" text-anchor="start" class="t" font-size="12">3. Skip it if it makes a cycle</text><text x="495" y="190" text-anchor="start" class="t" font-size="12">4. Stop at (vertices − 1) edges</text><text x="610" y="235" text-anchor="middle" class="tg" font-size="13">Tree: 3 + 4 + 4 + 5 + 6 = 22</text><text x="610" y="258" text-anchor="middle" class="t2" font-size="12">Compare the total with the claim</text><text x="610" y="276" text-anchor="middle" class="t2" font-size="12">(e.g. less than 25 m?)</text><text x="380" y="325" text-anchor="middle" class="t2" font-size="12">Blue edges are in the tree: 6 vertices need 5 edges and no cycle.</text></svg>
