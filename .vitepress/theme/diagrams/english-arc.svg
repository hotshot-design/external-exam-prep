<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" role="img" aria-label="Line graph of Othello's rise and fall across five acts" class="dg"><defs><marker id="ah-english-arc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs><text x="380" y="26" text-anchor="middle" class="tt" font-size="17" font-weight="700">Othello: the tragic arc by act</text><g transform="translate(0,40)"><path d="M 70 220 C 130 210 150 190 190 190 C 250 190 270 130 310 120 C 370 100 400 60 440 70 C 500 85 530 160 580 190 C 640 225 670 260 700 270" class="lnb"/><circle cx="70" cy="220" r="6" class="dot"/><text x="70" y="266" text-anchor="middle" class="t2" font-size="11"><tspan x="70" y="252.2">Act 1</tspan><tspan x="70" y="266.0">Venice: marriage,</tspan><tspan x="70" y="279.8">Iago's plan</tspan></text><circle cx="190" cy="190" r="6" class="dot"/><text x="190" y="236" text-anchor="middle" class="t2" font-size="11"><tspan x="190" y="222.2">Act 2</tspan><tspan x="190" y="236.0">Cyprus: Cassio</tspan><tspan x="190" y="249.8">disgraced</tspan></text><circle cx="310" cy="120" r="6" class="dot"/><text x="310" y="166" text-anchor="middle" class="t2" font-size="11"><tspan x="310" y="152.2">Act 3</tspan><tspan x="310" y="166.0">Temptation scene</tspan><tspan x="310" y="179.8">handkerchief</tspan></text><circle cx="440" cy="70" r="6" class="dot"/><text x="440" y="14" text-anchor="middle" class="t2" font-size="11"><tspan x="440" y="0.2">Act 3</tspan><tspan x="440" y="14.0">turning point:</tspan><tspan x="440" y="27.8">'Chaos is come again'</tspan></text><circle cx="580" cy="190" r="6" class="dot"/><text x="580" y="128" text-anchor="middle" class="t2" font-size="11"><tspan x="580" y="114.2">Act 4</tspan><tspan x="580" y="128.0">prose collapse (4.1)</tspan><tspan x="580" y="141.8">strikes Desdemona</tspan></text><circle cx="700" cy="270" r="6" class="dot"/><text x="700" y="218" text-anchor="middle" class="t2" font-size="11"><tspan x="700" y="204.2">Act 5</tspan><tspan x="700" y="218.0">murder, truth,</tspan><tspan x="700" y="231.8">'loved not wisely'</tspan></text><text x="380" y="315" text-anchor="middle" class="t2" font-size="12">Rise → complication → crisis (3.3) → fall. Verse becomes fragmented prose as Othello breaks down.</text></g></svg>
