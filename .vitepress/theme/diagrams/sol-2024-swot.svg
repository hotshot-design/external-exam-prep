<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-label="SWOT matrix filled with Gym Business case facts" class="dg"><defs><marker id="ah-sol-2024-swot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs><text x="380" y="24" text-anchor="middle" class="tt" font-size="17" font-weight="700">2024 report: SWOT for the Gym Business (case facts)</text><rect x="30" y="45" width="335" height="140" rx="8" class="boxg"/><text x="197" y="69" text-anchor="middle" class="tg" font-size="15">Strengths</text><text x="44" y="100" text-anchor="start" class="t" font-size="12">• Passionate, visible owners (S4)</text><text x="44" y="126" text-anchor="start" class="t" font-size="12">• Loyal foundation members (S2, S4)</text><text x="44" y="152" text-anchor="start" class="t" font-size="12">• $900 000 investment on offer (S6)</text><rect x="395" y="45" width="335" height="140" rx="8" class="boxr"/><text x="562" y="69" text-anchor="middle" class="tr" font-size="15">Weaknesses</text><text x="409" y="100" text-anchor="start" class="t" font-size="12">• Profit and membership falling since 2020</text><text x="409" y="126" text-anchor="start" class="t" font-size="12">• Few services, lock-in contracts (S4)</text><text x="409" y="152" text-anchor="start" class="t" font-size="12">• No budget or forecast (S6)</text><rect x="30" y="195" width="335" height="140" rx="8" class="boxg"/><text x="197" y="219" text-anchor="middle" class="tg" font-size="15">Opportunities</text><text x="44" y="250" text-anchor="start" class="t" font-size="12">• Wellbeing demand: 70% want self-care (S11)</text><text x="44" y="276" text-anchor="start" class="t" font-size="12">• Virtual fitness programs up 95% (S10)</text><text x="44" y="302" text-anchor="start" class="t" font-size="12">• New services: dietitian, physio (S7)</text><rect x="395" y="195" width="335" height="140" rx="8" class="boxr"/><text x="562" y="219" text-anchor="middle" class="tr" font-size="15">Threats</text><text x="409" y="250" text-anchor="start" class="t" font-size="12">• Traditional gyms down 15% (S10)</text><text x="409" y="276" text-anchor="start" class="t" font-size="12">• Home gym equipment up 236% (S10)</text><text x="409" y="302" text-anchor="start" class="t" font-size="12">• Rivals with the vibe, no contracts (S4)</text><text x="380" y="350" text-anchor="middle" class="t2" font-size="12">Internal = S/W (top). External = O/T (bottom). Cite stimulus numbers.</text></svg>
