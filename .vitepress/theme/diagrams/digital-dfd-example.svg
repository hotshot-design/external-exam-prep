<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-label="Library system data flow diagram with Student, two processes and four data stores" class="dg"><defs><marker id="ah-dfd-example" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs><text x="380" y="26" text-anchor="middle" class="tt" font-size="17" font-weight="700">Example DFD: library system (2025 Q11)</text><rect x="30" y="125" width="120" height="54" rx="2" class="box"/><text x="90.0" y="157.0" text-anchor="middle" class="t" font-size="14" font-weight="600">Student</text><rect x="250" y="60" width="170" height="54" rx="10" class="boxb"/><text x="335.0" y="92.0" text-anchor="middle" class="t" font-size="14" font-weight="600">Search</text><text x="272" y="76" text-anchor="middle" class="tb" font-size="12">2.0</text><rect x="250" y="190" width="170" height="54" rx="10" class="boxb"/><text x="335.0" y="222.0" text-anchor="middle" class="t" font-size="14" font-weight="600">Book delivery</text><text x="272" y="206" text-anchor="middle" class="tb" font-size="12">1.0</text><path d="M 560 40 L 720 40 M 560 80 L 720 80 M 560 40 L 560 80" class="ln" fill="none"/><text x="582" y="65" text-anchor="middle" class="tb" font-size="12">D1</text><line x1="602" y1="40" x2="602" y2="80" class="ln"/><text x="661.0" y="65" text-anchor="middle" class="t" font-size="13">Authors</text><path d="M 560 90 L 720 90 M 560 130 L 720 130 M 560 90 L 560 130" class="ln" fill="none"/><text x="582" y="115" text-anchor="middle" class="tb" font-size="12">D2</text><line x1="602" y1="90" x2="602" y2="130" class="ln"/><text x="661.0" y="115" text-anchor="middle" class="t" font-size="13">Titles</text><path d="M 560 140 L 720 140 M 560 180 L 720 180 M 560 140 L 560 180" class="ln" fill="none"/><text x="582" y="165" text-anchor="middle" class="tb" font-size="12">D3</text><line x1="602" y1="140" x2="602" y2="180" class="ln"/>