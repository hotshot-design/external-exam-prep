<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-label="Mock-up of the pothole app with address list, filter, sort and offline map" class="dg"><defs><marker id="ah-sol-2025-q16e-pothole" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs><text x="380" y="24" text-anchor="middle" class="tt" font-size="17" font-weight="700">2025 Q16e: improved Road Maintenance app mock-up</text><rect x="30" y="45" width="430" height="340" rx="14" class="box"/><rect x="45" y="58" width="280" height="30" rx="15" class="boxy"/><text x="185.0" y="78.0" text-anchor="middle" class="t" font-size="11">Search or filter: suburb · postcode · date</text><rect x="335" y="58" width="110" height="30" rx="15" class="boxy"/><text x="390.0" y="78.0" text-anchor="middle" class="t" font-size="11">Sort: nearest</text><rect x="45" y="100" width="400" height="58" rx="8" class="box"/><text x="60" y="124" text-anchor="start" class="t" font-size="13" font-weight="600">Smith St, Brisbane</text><text x="60" y="144" text-anchor="start" class="t2" font-size="11">0.8 km away · logged 12 Oct</text><rect x="325" y="112" width="108" height="32" rx="16" class="boxb"/><text x="379.0" y="133.0" text-anchor="middle" class="t" font-size="10">Mark complete</text><rect x="45" y="170" width="400" height="58" rx="8" class="box"/><text x="60" y="194" text-anchor="start" class="t" font-size="13" font-weight="600">Ann St, Brisbane</text><text x="60" y="214" text-anchor="start" class="t2" font-size="11">0.8 km away · logged 12 Oct</text><rect x="325" y="182" width="108" height="32" rx="16" class="boxb"/><text x="379.0" y="203.0" text-anchor="middle" class="t" font-size="10">Mark complete</text><rect x="45" y="240" width="400" height="58" rx="8" class="box"/><text x="60" y="264" text-anchor="start" class="t" font-size="13" font-weight="600">High St, Ipswich</text><text x="60" y="284" text-anchor="start" class="t2" font-size="11">0.8 km away · logged 12 Oct</text><rect x="325" y="252" width="108" height="32" rx="16" class="boxg"/><text x="379.0" y="273.0" text-anchor="middle" class="t" font-size="10">Done ✓</text><rect x="45" y="318" width="195" height="52" rx="8" class="boxb"/><text x="142.5" y="349.0" text-anchor="middle" class="t" font-size="12">Offline map</text><rect x="250" y="318" width="195" height="52" rx="8" class="boxr"/><text x="347.5" y="349.0" text-anchor="middle" class="t" font-size="12">Confirm before saving</text><text x="480" y="75" text-anchor="start" class="tb" font-size="13">Effectiveness</text><text x="480" y="96" text-anchor="start" class="t" font-size="11">• addresses instead of raw coordinates</text><text x="480" y="114" text-anchor="start" class="t" font-size="11">• filter by suburb, postcode, date</text><text x="480" y="132" text-anchor="start" class="t" font-size="11">• sort by distance from the worker</text><text x="480" y="150" text-anchor="start" class="t" font-size="11">• offline map for directions</text><text x="480" y="190" text-anchor="start" class="tr" font-size="13">Safety (error prevention)</text><text x="480" y="211" text-anchor="start" class="t" font-size="11">• meaningful job names, not filenames</text><text x="480" y="229" text-anchor="start" class="t" font-size="11">• status shown on each row</text><text x="480" y="247" text-anchor="start" class="t" font-size="11">• confirm dialog before saving</text><text x="480" y="265" text-anchor="start" class="t" font-size="11">• mark-complete button per job</text></svg>
