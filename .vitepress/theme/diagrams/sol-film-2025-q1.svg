<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-label="Mind map of context facts and what to analyse for the Mitski question" class="dg"><defs><marker id="ah-sol-film-2025-q1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs><text x="380" y="24" text-anchor="middle" class="tt" font-size="17" font-weight="700">2025 Q1 Technologies: Mitski, Love Me More</text><rect x="190" y="40" width="380" height="34" rx="8" class="boxy"/><text x="380.0" y="62.0" text-anchor="middle" class="t" font-size="13" font-weight="700">Key concept: technologies</text><rect x="20" y="90" width="235" height="190" rx="8" class="boxb"/><text x="32" y="112" text-anchor="start" class="tb" font-size="13" font-weight="700">Context of production</text><text x="32" y="132" text-anchor="start" class="t" font-size="12">Mitski, fourth single from</text><text x="32" y="148" text-anchor="start" class="t" font-size="12">Laurel Hell (2022); second</text><text x="32" y="164" text-anchor="start" class="t" font-size="12">Mitski video directed by</text><text x="32" y="180" text-anchor="start" class="t" font-size="12">Christopher Good. Meaning:</text><text x="32" y="196" text-anchor="start" class="t" font-size="12">isolation as a singer-</text><text x="32" y="212" text-anchor="start" class="t" font-size="12">songwriter and longing for</text><text x="32" y="228" text-anchor="start" class="t" font-size="12">connection and validation; a</text><text x="32" y="244" text-anchor="start" class="t" font-size="12">romantic relationship as the</text><text x="32" y="260" text-anchor="start" class="t" font-size="12">“narrative vehicle”.</text><rect x="262" y="90" width="235" height="190" rx="8" class="boxg"/><text x="274" y="112" text-anchor="start" class="tg" font-size="13" font-weight="700">Context of use</text><text x="274" y="132" text-anchor="start" class="t" font-size="12">Music video circulated online</text><text x="274" y="148" text-anchor="start" class="t" font-size="12">for streaming audiences. You</text><text x="274" y="164" text-anchor="start" class="t" font-size="12">must name and justify a</text><text x="274" y="180" text-anchor="start" class="t" font-size="12">target audience (age,</text><text x="274" y="196" text-anchor="start" class="t" font-size="12">interests).</text><rect x="504" y="90" width="236" height="190" rx="8" class="box"/><text x="516" y="112" text-anchor="start" class="tr" font-size="13" font-weight="700">Analyse after watching</text><text x="516" y="132" text-anchor="start" class="t" font-size="12">Technologies and how they</text><text x="516" y="148" text-anchor="start" class="t" font-size="12">work with other elements to</text><text x="516" y="164" text-anchor="start" class="t" font-size="12">build isolation and longing.</text><text x="516" y="180" text-anchor="start" class="t" font-size="12">Link each point to the target</text><text x="516" y="196" text-anchor="start" class="t" font-size="12">audience.</text><line x1="137" y1="280" x2="137" y2="305" class="arb" marker-end="url(#ah-sol-film-2025-q1)"/><line x1="380" y1="280" x2="380" y2="305" class="arg" marker-end="url(#ah-sol-film-2025-q1)"/><line x1="622" y1="280" x2="622" y2="305" class="arr" marker-end="url(#ah-sol-film-2025-q1)"/><rect x="20" y="305" width="720" height="75" rx="10" class="boxi"/><text x="36" y="330" text-anchor="start" class="ti" font-size="13" font-weight="700">Viewpoint (appraise)</text><text x="36" y="352" text-anchor="start" class="t" font-size="12">How effectively have technologies been used to enhance meaning? Judge effectiveness for the</text><text x="36" y="368" text-anchor="start" class="t" font-size="12">target audience and name one limit.</text></svg>
