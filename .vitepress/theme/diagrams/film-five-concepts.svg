<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img" aria-label="Five key concepts arranged around contexts of production and use" class="dg"><defs><marker id="ah-five-concepts" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs><text x="380" y="26" text-anchor="middle" class="tt" font-size="17" font-weight="700">The five key concepts in contexts of production and use</text><g transform="translate(0,36)"><circle cx="380" cy="205" r="95" class="box"/><text x="380" y="175" text-anchor="middle" class="tb" font-size="13">CONTEXTS OF</text><text x="380" y="193" text-anchor="middle" class="tb" font-size="13">PRODUCTION AND USE</text><text x="380" y="222" text-anchor="middle" class="t2" font-size="11"><tspan x="380" y="215.1">who, why, funding,</tspan><tspan x="380" y="228.9">platform, audience</tspan></text><rect x="295.0" y="17.0" width="170" height="56" rx="8" class="boxb"/><text x="380.0" y="43.0" text-anchor="middle" class="t" font-size="14" font-weight="700">Technologies</text><text x="380.0" y="59.0" text-anchor="middle" class="t2" font-size="11">tools and processes</text><rect x="551.7852593996914" y="127.55728090000841" width="170" height="56" rx="8" class="boxg"/><text x="636.7852593996914" y="153.5572809000084" text-anchor="middle" class="t" font-size="14" font-weight="700">Representations</text><text x="636.7852593996914" y="169.5572809000084" text-anchor="middle" class="t2" font-size="11">people, places, ideas</text><rect x="453.70201811896777" y="306.44271909999156" width="170" height="56" rx="8" class="boxy"/><text x="538.7020181189678" y="332.44271909999156" text-anchor="middle" class="t" font-size="14" font-weight="700">Audiences</text><text x="538.7020181189678" y="348.44271909999156" text-anchor="middle" class="t2" font-size="11">who it is made for</text><rect x="136.29798188103229" y="306.44271909999156" width="170" height="56" rx="8" class="boxr"/><text x="221.29798188103229" y="332.44271909999156" text-anchor="middle" class="t" font-size="14" font-weight="700">Institutions</text><text x="221.29798188103229" y="348.44271909999156" text-anchor="middle" class="t2" font-size="11">organisations and rules</text><rect x="38.21474060030852" y="127.55728090000844" width="170" height="56" rx="8" class="boxi"/><text x="123.21474060030852" y="153.55728090000844" text-anchor="middle" class="t" font-size="14" font-weight="700">Languages</text><text x="123.21474060030852" y="169.55728090000844" text-anchor="middle" class="t2" font-size="11">codes and conventions</text></g><text x="380" y="428" text-anchor="middle" class="t2" font-size="12">2024–25 questions each named one of technologies, representations, institutions or audiences.</text></svg>
