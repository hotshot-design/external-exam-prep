<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-label="Bars comparing the additional costs, the investment and the benefits" class="dg"><defs><marker id="ah-sol-2024-costbenefit" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs><text x="380" y="24" text-anchor="middle" class="tt" font-size="17" font-weight="700">2024: cost-benefit summary (Stimulus 8)</text><text x="20" y="86" text-anchor="start" class="t" font-size="14">Additional costs</text><rect x="190" y="60" width="382.28318181818184" height="40" rx="6" class="boxr"/><text x="580.2831818181819" y="86" text-anchor="start" class="t" font-size="13" font-weight="600">$934 470</text><text x="20" y="148" text-anchor="start" class="t" font-size="14">Anton's investment</text><rect x="190" y="122" width="368.1818181818182" height="40" rx="6" class="boxy"/><text x="566.1818181818182" y="148" text-anchor="start" class="t" font-size="13" font-weight="600">$900 000</text><text x="20" y="210" text-anchor="start" class="t" font-size="14">Benefits (year 1)</text><rect x="190" y="184" width="449.4681818181818" height="40" rx="6" class="boxg"/><text x="647.4681818181818" y="210" text-anchor="start" class="t" font-size="13" font-weight="600">$1 098 700</text><text x="380" y="262" text-anchor="middle" class="tr" font-size="14">Shortfall: 934 470 − 900 000 = $34 470</text><text x="380" y="286" text-anchor="middle" class="t2" font-size="12">Net benefit: 1 098 700 − 934 470 = $164 230.  Payback: 934 470 ÷ 1 098 700 = 0.85 years (10.2 months).</text><text x="380" y="308" text-anchor="middle" class="t2" font-size="11">Costs: registration $15 000 · wages $342 000 · recruitment and training $2 470 · refurbishment $500 000 · marketing $75 000</text></svg>
