<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-label="Data points with the 3-point moving average line" class="dg"><defs><marker id="ah-ex-2-moving" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs><text x="380" y="24" text-anchor="middle" class="tt" font-size="17" font-weight="700">Example 2: 3-point moving average</text><line x1="60" y1="270" x2="60" y2="60" class="ar" marker-end="url(#ah-ex-2-moving)"/><line x1="60" y1="270" x2="500" y2="270" class="ar" marker-end="url(#ah-ex-2-moving)"/><text x="500" y="288" text-anchor="middle" class="t2" font-size="11">time</text><text x="54" y="52" text-anchor="start" class="t2" font-size="11">value</text><polyline points="95.0,222.0 157.0,186.0 219.0,198.0 281.0,150.0 343.0,126.0 405.0,138.0 467.0,90.0" class="lnl" fill="none"/><circle cx="95" cy="222" r="5" class="dot"/><text x="83" y="212" text-anchor="middle" class="t2" font-size="11">12</text><circle cx="157" cy="186" r="5" class="dot"/><text x="145" y="176" text-anchor="middle" class="t2" font-size="11">15</text><circle cx="219" cy="198" r="5" class="dot"/><text x="207" y="216" text-anchor="middle" class="t2" font-size="11">14</text><circle cx="281" cy="150" r="5" class="dot"/><text x="269" y="140" text-anchor="middle" class="t2" font-size="11">18</text><circle cx="343" cy="126" r="5" class="dot"/><text x="331" y="116" text-anchor="middle" class="t2" font-size="11">20</text><circle cx="405" cy="138" r="5" class="dot"/><text x="393" y="156" text-anchor="middle" class="t2" font-size="11">19</text><circle cx="467" cy="90" r="5" class="dot"/><text x="455" y="80" text-anchor="middle" class="t2" font-size="11">23</text><polyline points="157.0,202.0 219.0,178.0 281.0,158.0 343.0,138.0 405.0,118.0" class="lng" fill="none"/><circle cx="157" cy="202.0" r="5" class="dotg"/><text x="171" y="220.0" text-anchor="middle" class="tg" font-size="11">13.7</text><circle cx="219" cy="178.0" r="5" class="dotg"/><text x="233" y="168.0" text-anchor="middle" class="tg" font-size="11">15.7</text><circle cx="281" cy="158.0" r="5" class="dotg"/><text x="295" y="176.0" text-anchor="middle" class="tg" font-size="11">17.3</text><circle cx="343" cy="138.0" r="5" class="dotg"/><text x="357" y="156.0" text-anchor="middle" class="tg" font-size="11">19.0</text><circle cx="405" cy="118.0" r="5" class="dotg"/><text x="419" y="108.0" text-anchor="middle" class="tg" font-size="11">20.7</text><rect x="520" y="55" width="225" height="175" rx="8" class="box"/><text x="535" y="80" text-anchor="start" class="t" font-size="12">Smoothed value i =</text><text x="535" y="100" text-anchor="start" class="t" font-size="12">mean of values i−1, i, i+1</text><text x="535" y="130" text-anchor="start" class="tg" font-size="12">(12 + 15 + 14) ÷ 3 = 13.7</text><text x="535" y="150" text-anchor="start" class="tg" font-size="12">(15 + 14 + 18) ÷ 3 = 15.7</text><text x="535" y="180" text-anchor="start" class="t2" font-size="12">first and last points</text><text x="535" y="198" text-anchor="start" class="t2" font-size="12">have no smoothed value</text><text x="380" y="308" text-anchor="middle" class="t2" font-size="11">Grey line: data. Green line: smoothed series.</text></svg>
