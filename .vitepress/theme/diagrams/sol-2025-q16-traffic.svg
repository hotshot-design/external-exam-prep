<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 370" role="img" aria-label="Sensors send data to processing units which instruct adaptive signals" class="dg"><defs><marker id="ah-sol-2025-q16-traffic" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs><text x="380" y="26" text-anchor="middle" class="tt" font-size="17" font-weight="700">2025 Q16a: smart traffic system with an emergency vehicle</text><rect x="20" y="150" width="150" height="70" rx="8" class="boxb"/><text x="95.0" y="183.0" text-anchor="middle" class="t" font-size="15" font-weight="700">Sensors</text><text x="95.0" y="199.0" text-anchor="middle" class="t2" font-size="12">position and speed</text><rect x="305" y="150" width="170" height="70" rx="8" class="boxy"/><text x="390.0" y="183.0" text-anchor="middle" class="t" font-size="14" font-weight="700">Data processing units</text><text x="390.0" y="199.0" text-anchor="middle" class="t2" font-size="11">analyse, predict path</text><rect x="590" y="150" width="150" height="70" rx="8" class="boxg"/><text x="665.0" y="183.0" text-anchor="middle" class="t" font-size="15" font-weight="700">Adaptive signals</text><text x="665.0" y="199.0" text-anchor="middle" class="t2" font-size="12">change timing</text><line x1="170" y1="185" x2="305" y2="185" class="arb" marker-end="url(#ah-sol-2025-q16-traffic)"/><text x="238" y="175" text-anchor="middle" class="t2" font-size="11">real-time data</text><line x1="475" y1="185" x2="590" y2="185" class="arb" marker-end="url(#ah-sol-2025-q16-traffic)"/><text x="532" y="175" text-anchor="middle" class="t2" font-size="11">instructions</text><rect x="20" y="55" width="150" height="40" rx="8" class="boxr"/><text x="95.0" y="80.0" text-anchor="middle" class="t" font-size="13">Emergency vehicle</text><line x1="95" y1="95" x2="95" y2="150" class="arr" marker-end="url(#ah-sol-2025-q16-traffic)"/><rect x="590" y="265" width="150" height="70" rx="8" class="box"/><text x="665" y="288" text-anchor="middle" class="tg" font-size="12">path signals green</text><text x="665" y="308" text-anchor="middle" class="tr" font-size="12">others stop</text><text x="665" y="326" text-anchor="middle" class="tr" font-size="12">crossings: danger</text><line x1="665" y1="220" x2="665" y2="265" class="arg" marker-end="url(#ah-sol-2025-q16-traffic)"/><text x="240" y="310" text-anchor="middle" class="t2" font-size="12">System adapts as conditions change, then returns to normal</text><text x="240" y="330" text-anchor="middle" class="t2" font-size="12">operation once the vehicle has passed.</text></svg>
