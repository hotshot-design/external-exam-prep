<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-label="Loan balance falling over six months with the recurrence relation" class="dg"><defs><marker id="ah-reducing-balance" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs><text x="380" y="26" text-anchor="middle" class="tt" font-size="17" font-weight="700">Reducing-balance loan: balance after each repayment</text><line x1="60" y1="285" x2="60" y2="70" class="ar" marker-end="url(#ah-reducing-balance)"/><line x1="60" y1="285" x2="500" y2="285" class="ar" marker-end="url(#ah-reducing-balance)"/><text x="500" y="303" text-anchor="middle" class="t2" font-size="12">month n</text><text x="50" y="64" text-anchor="middle" class="t2" font-size="12">balance ($)</text><polyline points="100.0,96.7 200.0,149.1 300.0,201.7 400.0,254.5 500.0,307.6" class="lnb" fill="none"/><circle cx="100" cy="96.66666666666666" r="5" class="dot"/><text x="106" y="84.66666666666666" text-anchor="start" class="t" font-size="11">A₀ = 24 000.00</text><circle cx="200" cy="149.05" r="5" class="dot"/><text x="206" y="137.05" text-anchor="start" class="t" font-size="11">A₁ = 23 551.00</text><circle cx="300" cy="201.66905833333362" r="5" class="dot"/><text x="306" y="189.66905833333362" text-anchor="start" class="t" font-size="11">A₂ = 23 099.98</text><circle cx="400" cy="254.5249024291669" r="5" class="dot"/><text x="406" y="242.5249024291669" text-anchor="start" class="t" font-size="11">A₃ = 22 646.93</text><circle cx="500" cy="307.6185978234318" r="5" class="dot"/><text x="90" y="301" text-anchor="middle" class="t2" font-size="11">0</text><rect x="520" y="60" width="225" height="200" rx="8" class="box"/><text x="632" y="84" text-anchor="middle" class="tb" font-size="14">Recurrence</text><text x="632" y="112" text-anchor="middle" class="t" font-size="14">A(n+1) = r · A(n) − d</text><text x="632" y="136" text-anchor="middle" class="t2" font-size="12">r = 1 + monthly rate</text><text x="632" y="154" text-anchor="middle" class="t2" font-size="12">d = repayment</text><text x="632" y="184" text-anchor="middle" class="t2" font-size="12">Example (5.4% p.a., $557):</text><text x="632" y="204" text-anchor="middle" class="t" font-size="13">r = 1.0045, A₀ = 24 000</text><text x="632" y="228" text-anchor="middle" class="tg" font-size="12">interest = payments − reduction</text><text x="632" y="246" text-anchor="middle" class="tg" font-size="12">in balance</text><text x="380" y="325" text-anchor="middle" class="t2" font-size="12">Each month: add interest to the balance, then subtract the repayment.</text></svg>
