<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-label="Business report structure with marks per section" class="dg"><defs><marker id="ah-report" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs><text x="380" y="26" text-anchor="middle" class="tt" font-size="17" font-weight="700">Business report: where the marks are (2025, 24 marks)</text><rect x="30" y="55" width="470" height="40" rx="6" class="box"/><text x="265.0" y="80.0" text-anchor="middle" class="t" font-size="13">1  Describe the situation</text><rect x="510" y="55" width="82.5" height="40" rx="6" class="boxb"/><text x="551.25" y="80.0" text-anchor="middle" class="t" font-size="13">2 marks</text><rect x="30" y="105" width="470" height="40" rx="6" class="box"/><text x="265.0" y="130.0" text-anchor="middle" class="t" font-size="13">2  SWOT with case data</text><rect x="510" y="105" width="125.0" height="40" rx="6" class="boxb"/><text x="572.5" y="130.0" text-anchor="middle" class="t" font-size="13">4 marks</text><rect x="30" y="155" width="470" height="40" rx="6" class="box"/><text x="265.0" y="180.0" text-anchor="middle" class="t" font-size="13">3  ONE relationship + ONE trend, effects, implications</text><rect x="510" y="155" width="210.0" height="40" rx="6" class="boxg"/><text x="615.0" y="180.0" text-anchor="middle" class="t" font-size="13">8 marks</text><rect x="30" y="205" width="470" height="40" rx="6" class="box"/><text x="265.0" y="230.0" text-anchor="middle" class="t" font-size="13">4  Evaluate ONE strategy with TWO criteria</text><rect x="510" y="205" width="210.0" height="40" rx="6" class="boxg"/><text x="615.0" y="230.0" text-anchor="middle" class="t" font-size="13">8 marks</text><rect x="30" y="255" width="470" height="40" rx="6" class="box"/><text x="265.0" y="280.0" text-anchor="middle" class="t" font-size="13">5  Decision, then recommendation</text><rect x="510" y="255" width="125.0" height="40" rx="6" class="boxy"/><text x="572.5" y="280.0" text-anchor="middle" class="t" font-size="13">(in 4)</text><rect x="30" y="305" width="470" height="40" rx="6" class="box"/><text x="265.0" y="330.0" text-anchor="middle" class="t" font-size="13">6  Concise, logical report layout</text><rect x="510" y="305" width="82.5" height="40" rx="6" class="boxb"/><text x="551.25" y="330.0" text-anchor="middle" class="t" font-size="13">2 marks</text><text x="380" y="385" text-anchor="middle" class="t2" font-size="12">16 of 24 marks are for synthesising (3) and evaluating (4). Keep the SWOT short. 400–600 words.</text></svg>
