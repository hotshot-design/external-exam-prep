<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-label="Analytical paragraph steps from topic sentence to link" class="dg"><defs><marker id="ah-english-paragraph" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs><text x="380" y="26" text-anchor="middle" class="tt" font-size="17" font-weight="700">Analytical paragraph: point to link</text><rect x="15" y="50" width="235" height="40" rx="8" class="boxb"/><text x="132.5" y="75.0" text-anchor="middle" class="t" font-size="13" font-weight="700">1  Topic sentence</text><rect x="15" y="94" width="235" height="34" rx="6" class="box"/><text x="132.5" y="116.0" text-anchor="middle" class="t" font-size="12">uses the prompt's key word</text><rect x="263" y="50" width="235" height="40" rx="8" class="boxg"/><text x="380.5" y="75.0" text-anchor="middle" class="t" font-size="13" font-weight="700">2  Embedded quote</text><rect x="263" y="94" width="235" height="34" rx="6" class="box"/><text x="380.5" y="116.0" text-anchor="middle" class="t" font-size="12">6–10 words, accurate</text><rect x="511" y="50" width="235" height="40" rx="8" class="boxy"/><text x="628.5" y="75.0" text-anchor="middle" class="t" font-size="13" font-weight="700">3  Named technique</text><rect x="511" y="94" width="235" height="34" rx="6" class="box"/><text x="628.5" y="116.0" text-anchor="middle" class="t" font-size="12">soliloquy, imagery, irony…</text><rect x="15" y="140" width="235" height="40" rx="8" class="boxi"/><text x="132.5" y="165.0" text-anchor="middle" class="t" font-size="13" font-weight="700">4  Effect on reader</text><rect x="15" y="184" width="235" height="34" rx="6" class="box"/><text x="132.5" y="206.0" text-anchor="middle" class="t" font-size="12">how the audience is positioned</text><rect x="263" y="140" width="235" height="40" rx="8" class="boxr"/><text x="380.5" y="165.0" text-anchor="middle" class="t" font-size="13" font-weight="700">5  Context / value</text><rect x="263" y="184" width="235" height="34" rx="6" class="box"/><text x="380.5" y="206.0" text-anchor="middle" class="t" font-size="12">race, gender, honour</text><rect x="511" y="140" width="235" height="40" rx="8" class="boxb"/><text x="628.5" y="165.0" text-anchor="middle" class="t" font-size="13" font-weight="700">6  Link to thesis</text><rect x="511" y="184" width="235" height="34" rx="6" class="box"/><text x="628.5" y="206.0" text-anchor="middle" class="t" font-size="12">answer the question</text><text x="380" y="250" text-anchor="middle" class="t" font-size="12">Example (reputation): Cassio's "I have lost the immortal part of myself" (2.3) uses hyperbole,</text><text x="380" y="270" text-anchor="middle" class="t" font-size="12">positioning the audience to see reputation as identity, in a society where honour is social currency.</text><text x="380" y="315" text-anchor="middle" class="t2" font-size="12">Marks: Knowledge application · Organisation and development · Textual features (45 total)</text><text x="380" y="335" text-anchor="middle" class="t2" font-size="12">800–1000 words; 15 min planning + 120 min writing.</text></svg>
