<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-label="Timeline of the flight showing departure, the 4828 km point and arrival in Sydney time" class="dg"><defs><marker id="ah-ex-14-flight" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs><text x="380" y="24" text-anchor="middle" class="tt" font-size="17" font-weight="700">Example 14: flight Sydney (UTC+10) to Los Angeles (UTC−8)</text><line x1="60" y1="120" x2="700" y2="120" class="ar" marker-end="url(#ah-ex-14-flight)"/><circle cx="60.0" cy="120" r="7" class="dot"/><text x="60.0" y="100" text-anchor="middle" class="t" font-size="13" font-weight="600">9:50 pm Tue</text><circle cx="300.0" cy="120" r="7" class="dotg"/><text x="300.0" y="100" text-anchor="middle" class="tg" font-size="13" font-weight="600">3:50 am Wed</text><circle cx="660.0" cy="120" r="7" class="dot"/><text x="660.0" y="100" text-anchor="middle" class="t" font-size="13" font-weight="600">12:50 pm Wed</text><text x="60.0" y="144" text-anchor="middle" class="t2" font-size="11">depart Sydney</text><text x="660.0" y="144" text-anchor="middle" class="t2" font-size="11">arrive (Sydney time)</text><text x="300.0" y="144" text-anchor="middle" class="tg" font-size="11">4828 km flown</text><line x1="60.0" y1="170" x2="660.0" y2="170" class="lnb"/><text x="360.0" y="190" text-anchor="middle" class="tb" font-size="13">15 h in the air</text><text x="380" y="215" text-anchor="middle" class="t" font-size="13">LA arrival 6:50 pm Tue + 18 h (UTC+10 − (−8)) = 12:50 pm Wed Sydney time</text><text x="380" y="240" text-anchor="middle" class="t" font-size="13">Fraction flown 4828 ÷ 12 070 = 0.4 → 0.4 × 15 h = 6 h → 9:50 pm Tue + 6 h = 3:50 am Wed</text><text x="380" y="275" text-anchor="middle" class="t2" font-size="12">Convert time zones first, then use the fraction of the total distance.</text></svg>
