<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-label="Five-part essay structure with approximate word counts" class="dg"><defs><marker id="ah-english-essay" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs><text x="380" y="26" text-anchor="middle" class="tt" font-size="17" font-weight="700">Essay structure (800–1000 words, 120 min writing)</text><rect x="15" y="60" width="138" height="40" rx="8" class="boxb"/><text x="84.0" y="85.0" text-anchor="middle" class="t" font-size="14" font-weight="700">Introduction</text><rect x="15" y="104" width="138" height="60" rx="6" class="box"/><text x="84.0" y="139.0" text-anchor="middle" class="t" font-size="12"><tspan x="84.0" y="131.5">thesis uses the</tspan><tspan x="84.0" y="146.5">prompt's key word</tspan></text><text x="84" y="186" text-anchor="middle" class="t2" font-size="11">about 120 words</text><rect x="163" y="60" width="138" height="40" rx="8" class="boxg"/><text x="232.0" y="85.0" text-anchor="middle" class="t" font-size="14" font-weight="700">Body 1</text><rect x="163" y="104" width="138" height="60" rx="6" class="box"/><text x="232.0" y="139.0" text-anchor="middle" class="t" font-size="12"><tspan x="232.0" y="131.5">idea + quotes +</tspan><tspan x="232.0" y="146.5">technique + context</tspan></text><text x="232" y="186" text-anchor="middle" class="t2" font-size="11">about 200 words</text><rect x="311" y="60" width="138" height="40" rx="8" class="boxg"/><text x="380.0" y="85.0" text-anchor="middle" class="t" font-size="14" font-weight="700">Body 2</text><rect x="311" y="104" width="138" height="60" rx="6" class="box"/><text x="380.0" y="139.0" text-anchor="middle" class="t" font-size="12"><tspan x="380.0" y="131.5">new angle that</tspan><tspan x="380.0" y="146.5">develops the thesis</tspan></text><text x="380" y="186" text-anchor="middle" class="t2" font-size="11">about 200 words</text><rect x="459" y="60" width="138" height="40" rx="8" class="boxy"/><text x="528.0" y="85.0" text-anchor="middle" class="t" font-size="14" font-weight="700">Body 3</text><rect x="459" y="104" width="138" height="60" rx="6" class="box"/><text x="528.0" y="139.0" text-anchor="middle" class="t" font-size="12"><tspan x="528.0" y="131.5">complication or</tspan><tspan x="528.0" y="146.5">counter-view</tspan></text><text x="528" y="186" text-anchor="middle" class="t2" font-size="11">about 200 words</text><rect x="607" y="60" width="138" height="40" rx="8" class="boxb"/><text x="676.0" y="85.0" text-anchor="middle" class="t" font-size="14" font-weight="700">Conclusion</text><rect x="607" y="104" width="138" height="60" rx="6" class="box"/><text x="676.0" y="139.0" text-anchor="middle" class="t" font-size="12"><tspan x="676.0" y="131.5">synthesise, don't</tspan><tspan x="676.0" y="146.5">summarise</tspan></text><text x="676" y="186" text-anchor="middle" class="t2" font-size="11">about 100 words</text><line x1="15" y1="215" x2="745" y2="215" class="lnl"/><text x="380" y="240" text-anchor="middle" class="tb" font-size="13">Before: 15 min plan (thesis, 3–4 ideas, 2–3 short quotes each)</text><text x="380" y="264" text-anchor="middle" class="tb" font-size="13">After: 10 min proofread (names, quotes, punctuation)</text><text x="380" y="300" text-anchor="middle" class="t2" font-size="12">Marked on: Knowledge application · Organisation and development · Textual features (45 marks)</text></svg>
