<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-label="Declining curve of a $10 000 asset losing 15% of its value each year" class="dg"><defs><marker id="ah-ex-4-depreciation" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs><text x="380" y="24" text-anchor="middle" class="tt" font-size="17" font-weight="700">Example 4: diminishing-value depreciation, $10 000 at 15% a year</text><line x1="70" y1="275" x2="70" y2="60" class="ar" marker-end="url(#ah-ex-4-depreciation)"/><line x1="70" y1="275" x2="490" y2="275" class="ar" marker-end="url(#ah-ex-4-depreciation)"/><text x="490" y="293" text-anchor="middle" class="t2" font-size="11">years n</text><text x="64" y="52" text-anchor="start" class="t2" font-size="11">value ($)</text><polyline points="90.0,80.0 152.0,109.2 214.0,134.1 276.0,155.2 338.0,173.2 400.0,188.5" class="lnr" fill="none"/><circle cx="90" cy="80.0" r="5" class="dotr"/><text x="96" y="70.0" text-anchor="start" class="t2" font-size="10">10 000.00</text><text x="90" y="291" text-anchor="middle" class="t2" font-size="11">0</text><circle cx="152" cy="109.25" r="5" class="dotr"/><text x="158" y="99.25" text-anchor="start" class="t2" font-size="10">8 500.00</text><text x="152" y="291" text-anchor="middle" class="t2" font-size="11">1</text><circle cx="214" cy="134.1125" r="5" class="dotr"/><text x="220" y="124.11250000000001" text-anchor="start" class="t2" font-size="10">7 225.00</text><text x="214" y="291" text-anchor="middle" class="t2" font-size="11">2</text><circle cx="276" cy="155.24562500000002" r="5" class="dotr"/><text x="282" y="145.24562500000002" text-anchor="start" class="t2" font-size="10">6 141.25</text><text x="276" y="291" text-anchor="middle" class="t2" font-size="11">3</text><circle cx="338" cy="173.20878125000002" r="5" class="dotr"/><text x="344" y="163.20878125000002" text-anchor="start" class="t2" font-size="10">5 220.06</text><text x="338" y="291" text-anchor="middle" class="t2" font-size="11">4</text><circle cx="400" cy="188.47746406250002" r="5" class="dotr"/><text x="406" y="178.47746406250002" text-anchor="start" class="t2" font-size="10">4 437.05</text><text x="400" y="291" text-anchor="middle" class="t2" font-size="11">5</text><circle cx="276" cy="155.24562500000002" r="8" class="dotg"/><rect x="520" y="55" width="225" height="190" rx="8" class="box"/><text x="535" y="82" text-anchor="start" class="tr" font-size="13">Geometric decay</text><text x="535" y="110" text-anchor="start" class="t" font-size="13">t₁ = 10 000, r = 0.85</text><text x="535" y="138" text-anchor="start" class="tb" font-size="13">value = 10 000 × 0.85ⁿ</text><text x="535" y="166" text-anchor="start" class="t" font-size="13">n = 3: 10 000 × 0.85³</text><text x="535" y="194" text-anchor="start" class="tg" font-size="13">= $6 141.25</text><text x="535" y="222" text-anchor="start" class="t2" font-size="13">r &lt; 1 means decay</text><text x="380" y="312" text-anchor="middle" class="t2" font-size="11">Arithmetic example: t₁ = 12, d = 5 → t₂₀ = 12 + 19 × 5 = 107. Geometric: t₁ = 3, r = 2 → t₆ = 3 × 2⁵ = 96.</text></svg>
