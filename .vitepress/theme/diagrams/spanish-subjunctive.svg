<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-label="The six triggers of the Spanish present subjunctive" class="dg"><defs><marker id="ah-spanish-subjunctive" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs><text x="380" y="26" text-anchor="middle" class="tt" font-size="17" font-weight="700">Present subjunctive: when to use it (WEIRDO)</text><rect x="20" y="50" width="225" height="90" rx="8" class="box"/><circle cx="48" cy="78" r="18" class="nodeb"/><text x="48" y="84" text-anchor="middle" class="tb" font-size="16">W</text><text x="150" y="83" text-anchor="middle" class="t" font-size="14" font-weight="600">Wishes</text><text x="132" y="116" text-anchor="middle" class="t2" font-size="12">Quiero que me ayudes.</text><rect x="265" y="50" width="225" height="90" rx="8" class="box"/><circle cx="293" cy="78" r="18" class="nodeb"/><text x="293" y="84" text-anchor="middle" class="tb" font-size="16">E</text><text x="395" y="83" text-anchor="middle" class="t" font-size="14" font-weight="600">Emotions</text><text x="377" y="116" text-anchor="middle" class="t2" font-size="12">Me alegra que tengas éxito.</text><rect x="510" y="50" width="225" height="90" rx="8" class="box"/><circle cx="538" cy="78" r="18" class="nodeb"/><text x="538" y="84" text-anchor="middle" class="tb" font-size="16">I</text><text x="640" y="83" text-anchor="middle" class="t" font-size="14" font-weight="600">Impersonal</text><text x="622" y="116" text-anchor="middle" class="t2" font-size="12">Es importante que estudiemos.</text><rect x="20" y="155" width="225" height="90" rx="8" class="box"/><circle cx="48" cy="183" r="18" class="nodeb"/><text x="48" y="189" text-anchor="middle" class="tb" font-size="16">R</text><text x="150" y="188" text-anchor="middle" class="t" font-size="14" font-weight="600">Recommendations</text><text x="132" y="221" text-anchor="middle" class="t2" font-size="12">Recomiendo que ahorres.</text><rect x="265" y="155" width="225" height="90" rx="8" class="box"/><circle cx="293" cy="183" r="18" class="nodeb"/><text x="293" y="189" text-anchor="middle" class="tb" font-size="16">D</text><text x="395" y="188" text-anchor="middle" class="t" font-size="14" font-weight="600">Doubt, denial</text><text x="377" y="221" text-anchor="middle" class="t2" font-size="12">Dudo que sea fácil.</text><rect x="510" y="155" width="225" height="90" rx="8" class="box"/><circle cx="538" cy="183" r="18" class="nodeb"/><text x="538" y="189" text-anchor="middle" class="tb" font-size="16">O</text><text x="640" y="188" text-anchor="middle" class="t" font-size="14" font-weight="600">Ojalá</text><text x="622" y="221" text-anchor="middle" class="t2" font-size="12">Ojalá que haga buen tiempo.</text><text x="380" y="275" text-anchor="middle" class="t" font-size="13">Also: cuando + future meaning → Cuando termine el colegio, viajaré.</text><text x="380" y="297" text-anchor="middle" class="t2" font-size="12">creo que + indicative (es)   ·   no creo que + subjunctive (sea)</text><text x="380" y="320" text-anchor="middle" class="t2" font-size="12">si + imperfect subjunctive → conditional: Si tuviera tiempo, haría voluntariado.</text></svg>
