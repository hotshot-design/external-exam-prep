<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-label="Business life-cycle curve with renewal, steady state or decline after maturity" class="dg"><defs><marker id="ah-life-cycle" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs><text x="380" y="26" text-anchor="middle" class="tt" font-size="17" font-weight="700">Business life cycle and the post-maturity options</text><line x1="60" y1="310" x2="60" y2="50" class="ar" marker-end="url(#ah-life-cycle)"/><line x1="60" y1="310" x2="700" y2="310" class="ar" marker-end="url(#ah-life-cycle)"/><text x="30" y="180" text-anchor="middle" class="t2"></text><text x="24" y="180" transform="rotate(-90 24 180)" text-anchor="middle" class="t2" font-size="12">sales / profit</text><text x="260" y="336" text-anchor="middle" class="t2" font-size="12">time</text><path d="M 70 290 C 130 285 160 240 220 190 C 280 140 310 100 360 95 L 420 95" class="lnb"/><path d="M 420 95 C 520 80 560 70 650 60" class="lng"/><path d="M 420 95 L 650 100" class="lny"/><path d="M 420 95 C 500 130 560 200 650 280" class="lnr"/><text x="120" y="335" text-anchor="middle" class="t2"></text><text x="260" y="335" text-anchor="middle" class="t2"></text><text x="390" y="335" text-anchor="middle" class="t2"></text><text x="95" y="268" text-anchor="middle" class="t" font-size="13">Seed</text><text x="170" y="232" text-anchor="middle" class="t" font-size="13">Start-up</text><text x="250" y="150" text-anchor="middle" class="t" font-size="13">Growth</text><text x="380" y="75" text-anchor="middle" class="t" font-size="13">Maturity</text><line x1="420" y1="55" x2="420" y2="305" class="lnl" stroke-dasharray="5 4"/><text x="535" y="42" text-anchor="middle" class="tg" font-size="13">Renewal (transformation)</text><text x="570" y="126" text-anchor="middle" class="ty" font-size="13">Steady state</text><text x="570" y="224" text-anchor="middle" class="tr" font-size="13">Decline</text><text x="560" y="336" text-anchor="middle" class="tb" font-size="12">POST-MATURITY: this exam covers renewal</text></svg>
