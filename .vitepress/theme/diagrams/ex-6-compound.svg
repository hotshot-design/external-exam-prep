<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-label="Growth curve of a compound-interest investment" class="dg"><defs><marker id="ah-ex-6-compound" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs><text x="380" y="24" text-anchor="middle" class="tt" font-size="17" font-weight="700">Example 6: $5 000 at 6% p.a. compounded monthly for 3 years</text><line x1="70" y1="270" x2="70" y2="60" class="ar" marker-end="url(#ah-ex-6-compound)"/><line x1="70" y1="270" x2="490" y2="270" class="ar" marker-end="url(#ah-ex-6-compound)"/><text x="490" y="288" text-anchor="middle" class="t2" font-size="11">months</text><text x="64" y="52" text-anchor="start" class="t2" font-size="11">balance ($)</text><polyline points="85.0,240.8 96.0,237.1 107.0,233.4 118.0,229.8 129.0,226.0 140.0,222.3 151.0,218.6 162.0,214.8 173.0,211.0 184.0,207.2 195.0,203.4 206.0,199.6 217.0,195.7 228.0,191.8 239.0,187.9 250.0,184.0 261.0,180.1 272.0,176.1 283.0,172.1 294.0,168.1 305.0,164.1 316.0,160.1 327.0,156.0 338.0,151.9 349.0,147.8 360.0,143.7 371.0,139.6 382.0,135.4 393.0,131.2 404.0,127.0 415.0,122.8 426.0,118.6 437.0,114.3 448.0,110.0 459.0,105.7 470.0,101.4 481.0,97.0" class="lnb" fill="none"/><circle cx="85" cy="240.76923076923077" r="5" class="dot"/><circle cx="481" cy="97.04115493673547" r="6" class="dotg"/><text x="97" y="232.76923076923077" text-anchor="start" class="t2" font-size="11">$5 000</text><text x="475" y="85.04115493673547" text-anchor="end" class="tg" font-size="12">$5 983.40</text><rect x="520" y="55" width="225" height="195" rx="8" class="box"/><text x="535" y="80" text-anchor="start" class="t" font-size="13">i = 0.06 ÷ 12 = 0.005</text><text x="535" y="106" text-anchor="start" class="t" font-size="13">n = 3 × 12 = 36</text><text x="535" y="132" text-anchor="start" class="tb" font-size="13">A = 5000 × 1.005³⁶</text><text x="535" y="158" text-anchor="start" class="tg" font-size="13">= $5 983.40</text><text x="535" y="184" text-anchor="start" class="t" font-size="13">interest = $983.40</text><text x="535" y="210" text-anchor="start" class="tb" font-size="13">EAR = 1.005¹² − 1</text><text x="535" y="236" text-anchor="start" class="tg" font-size="13">= 6.17%</text><text x="380" y="305" text-anchor="middle" class="t2" font-size="11">Interest is earned on interest already added, so the line curves slightly upward.</text></svg>
