<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-label="Gane-Sarson DFD symbols: external entity, process, data store and data flow" class="dg"><defs><marker id="ah-dfd-symbols" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs><text x="380" y="26" text-anchor="middle" class="tt" font-size="17" font-weight="700">Data flow diagram symbols (Gane-Sarson)</text><rect x="30" y="55" width="150" height="54" rx="2" class="box"/><text x="105.0" y="87.0" text-anchor="middle" class="t" font-size="14" font-weight="600">Student</text><text x="105" y="130" text-anchor="middle" class="tb" font-size="13">External entity</text><text x="105" y="158" text-anchor="middle" class="t2"><tspan x="105" y="149.2">source or destination</tspan><tspan x="105" y="166.8">outside the system</tspan></text><rect x="215" y="55" width="150" height="54" rx="10" class="boxb"/><text x="290.0" y="87.0" text-anchor="middle" class="t" font-size="14" font-weight="600">Search catalogue</text><text x="240" y="71" text-anchor="middle" class="tb" font-size="12">1.0</text><text x="290" y="130" text-anchor="middle" class="tb" font-size="13">Process</text><text x="290" y="158" text-anchor="middle" class="t2"><tspan x="290" y="149.2">numbered; verb or verb-object</tspan><tspan x="290" y="166.8">name; changes the data</tspan></text><path d="M 400 55 L 550 55 M 400 109 L 550 109 M 400 55 L 400 109" class="ln" fill="none"/><text x="425" y="87" text-anchor="middle" class="tb" font-size="13">D1</text><line x1="448" y1="55" x2="448" y2="109" class="ln"/><text x="500" y="87" text-anchor="middle" class="t" font-weight="600">Catalogue</text><text x="475" y="130" text-anchor="middle" class="tb" font-size="13">Data store</text><text x="475" y="158" text-anchor="middle" class="t2"><tspan x="475" y="149.2">numbered; type D, M or T;</tspan><tspan x="475" y="166.8">noun name</tspan></text><line x1="590" y1="82" x2="730" y2="82" class="arb" marker-end="url(#ah-dfd-symbols)"/><text x="660" y="70" text-anchor="middle" class="t" font-size="13">book request</text><text x="660" y="130" text-anchor="middle" class="tb" font-size="13">Data flow</text><text x="660" y="158" text-anchor="middle" class="t2"><tspan x="660" y="149.2">labelled with a noun;</tspan><tspan x="660" y="166.8">direction of the data</tspan></text><rect x="30" y="195" width="330" height="125" rx="8" class="box"/><text x="195" y="217" text-anchor="middle" class="tb" font-size="14">Data store types</text><text x="48" y="245" text-anchor="start" class="t" font-size="13">D  data on disk (kept when switched off)</text><text x="48" y="270" text-anchor="start" class="t" font-size="13">M  manual data (paper or manually processed)</text><text x="48" y="295" text-anchor="start" class="t" font-size="13">T  temporary or transient (RAM, cache)</text><rect x="385" y="195" width="345" height="125" rx="8" class="boxr"/><text x="557" y="217" text-anchor="middle" class="tr" font-size="14">Not allowed</text><text x="405" y="242" text-anchor="start" class="t" font-size="13">entity → entity</text><text x="405" y="264" text-anchor="start" class="t" font-size="13">entity → data store</text><text x="405" y="286" text-anchor="start" class="t" font-size="13">data store → entity</text><text x="405" y="308" text-anchor="start" class="t" font-size="13">(every flow must go through a process)</text></svg>
