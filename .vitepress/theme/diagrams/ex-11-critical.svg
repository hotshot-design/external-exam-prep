rt" class="tb" font-size="10">EST 3</text><text x="240" y="274" text-anchor="end" class="tr" font-size="10">LST 5</text><rect x="350" y="140" width="52" height="50" rx="6" class="boxg"/><text x="376" y="160" text-anchor="middle" class="t" font-size="14" font-weight="700">D</text><text x="376" y="178" text-anchor="middle" class="t2" font-size="11">5</text><text x="352" y="135" text-anchor="start" class="tb" font-size="10">EST 7</text><text x="400" y="204" text-anchor="end" class="tr" font-size="10">LST 7</text><rect x="510" y="140" width="52" height="50" rx="6" class="boxg"/><text x="536" y="160" text-anchor="middle" class="t" font-size="14" font-weight="700">E</text><text x="536" y="178" text-anchor="middle" class="t2" font-size="11">3</text><text x="512" y="135" text-anchor="start" class="tb" font-size="10">EST 12</text><text x="560" y="204" text-anchor="end" class="tr" font-size="10">LST 12</text><text x="380" y="315" text-anchor="middle" class="t" font-size="13">Path A→B→D→E = 3 + 4 + 5 + 3 = 15 (critical) · path A→C→D→E = 13</text><text x="380" y="338" text-anchor="middle" class="t2" font-size="12">Float for C = 15 − 13 = 2 (also LST − EST = 5 − 3).</text></svg>
