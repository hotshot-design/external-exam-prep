<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-label="Symmetric encryption uses one key; asymmetric uses a public and private key" class="dg"><defs><marker id="ah-sym-asym" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs><text x="380" y="26" text-anchor="middle" class="tt" font-size="17" font-weight="700">Symmetric vs asymmetric encryption</text><text x="380" y="56" text-anchor="middle" class="tb" font-size="14">SYMMETRIC (one shared key): Caesar, AES, one-time pad</text><rect x="30" y="70" width="130" height="50" rx="8" class="box"/><text x="95.0" y="100.0" text-anchor="middle" class="t" font-size="14">Plaintext</text><rect x="280" y="70" width="130" height="50" rx="8" class="boxb"/><text x="345.0" y="100.0" text-anchor="middle" class="t" font-size="14">Ciphertext</text><rect x="530" y="70" width="130" height="50" rx="8" class="box"/><text x="595.0" y="100.0" text-anchor="middle" class="t" font-size="14">Plaintext</text><line x1="160" y1="95" x2="280" y2="95" class="ar" marker-end="url(#ah-sym-asym)"/><line x1="410" y1="95" x2="530" y2="95" class="ar" marker-end="url(#ah-sym-asym)"/><text x="220" y="85" text-anchor="middle" class="t2">encrypt</text><text x="470" y="85" text-anchor="middle" class="t2">decrypt</text><rect x="185" y="135" width="80" height="28" rx="8" class="boxy"/><text x="225.0" y="154.0" text-anchor="middle" class="t" font-size="12">same key</text><rect x="435" y="135" width="80" height="28" rx="8" class="boxy"/><text x="475.0" y="154.0" text-anchor="middle" class="t" font-size="12">same key</text><line x1="225" y1="122" x2="225" y2="135" class="ln"/><line x1="475" y1="122" x2="475" y2="135" class="ln"/><text x="380" y="205" text-anchor="middle" class="tg" font-size="14">ASYMMETRIC (key pair): RSA</text><rect x="30" y="220" width="130" height="50" rx="8" class="box"/><text x="95.0" y="250.0" text-anchor="middle" class="t" font-size="14">Plaintext</text><rect x="280" y="220" width="130" height="50" rx="8" class="boxg"/><text x="345.0" y="250.0" text-anchor="middle" class="t" font-size="14">Ciphertext</text><rect x="530" y="220" width="130" height="50" rx="8" class="box"/><text x="595.0" y="250.0" text-anchor="middle" class="t" font-size="14">Plaintext</text><line x1="160" y1="245" x2="280" y2="245" class="ar" marker-end="url(#ah-sym-asym)"/><line x1="410" y1="245" x2="530" y2="245" class="ar" marker-end="url(#ah-sym-asym)"/><text x="220" y="235" text-anchor="middle" class="t2">encrypt</text><text x="470" y="235" text-anchor="middle" class="t2">decrypt</text><rect x="165" y="285" width="120" height="28" rx="8" class="boxg"/><text x="225.0" y="304.0" text-anchor="middle" class="t" font-size="12">public key</text><rect x="415" y="285" width="120" height="28" rx="8" class="boxr"/><text x="475.0" y="304.0" text-anchor="middle" class="t" font-size="12">private key</text><line x1="225" y1="272" x2="225" y2="285" class="ln"/><line x1="475" y1="272" x2="475" y2="285" class="ln"/><text x="380" y="345" text-anchor="middle" class="t2" font-size="12">Symmetric is fast and good for bulk data; asymmetric solves key exchange and signatures.</text></svg>
