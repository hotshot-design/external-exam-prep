<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-label="Mind map of context facts and what to analyse for the Goldfish question" class="dg"><defs><marker id="ah-sol-film-2024-q3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs><text x="380" y="24" text-anchor="middle" class="tt" font-size="17" font-weight="700">2024 Q3 Institutions: Goldfish Focus Faceoff Lens</text><rect x="190" y="40" width="380" height="34" rx="8" class="boxy"/><text x="380.0" y="62.0" text-anchor="middle" class="t" font-size="13" font-weight="700">Key concept: institutions</text><rect x="20" y="90" width="235" height="190" rx="8" class="boxb"/><text x="32" y="112" text-anchor="start" class="tb" font-size="13" font-weight="700">Context of production</text><text x="32" y="132" text-anchor="start" class="t" font-size="12">Campbell's hired Zulu Alpha</text><text x="32" y="148" text-anchor="start" class="t" font-size="12">Kilo to market a new Goldfish</text><text x="32" y="164" text-anchor="start" class="t" font-size="12">flavour to teenagers (13–17)</text><text x="32" y="180" text-anchor="start" class="t" font-size="12">with an AR Snapchat lens</text><text x="32" y="196" text-anchor="start" class="t" font-size="12">using eye-tracking and facial</text><text x="32" y="212" text-anchor="start" class="t" font-size="12">mesh.</text><rect x="262" y="90" width="235" height="190" rx="8" class="boxg"/><text x="274" y="112" text-anchor="start" class="tg" font-size="13" font-weight="700">Context of use</text><text x="274" y="132" text-anchor="start" class="t" font-size="12">Launched Nov 2021 on Snapchat</text><text x="274" y="148" text-anchor="start" class="t" font-size="12">for one month; paid</text><text x="274" y="164" text-anchor="start" class="t" font-size="12">promotion; high scores</text><text x="274" y="180" text-anchor="start" class="t" font-size="12">shared; a coupon reward.</text><text x="274" y="196" text-anchor="start" class="t" font-size="12">Success measured by playtime</text><text x="274" y="212" text-anchor="start" class="t" font-size="12">and sales (quadrupled</text><text x="274" y="228" text-anchor="start" class="t" font-size="12">revenue).</text><rect x="504" y="90" width="236" height="190" rx="8" class="box"/><text x="516" y="112" text-anchor="start" class="tr" font-size="13" font-weight="700">Analyse after watching</text><text x="516" y="132" text-anchor="start" class="t" font-size="12">Institutions (agency, brand,</text><text x="516" y="148" text-anchor="start" class="t" font-size="12">platform), audience</text><text x="516" y="164" text-anchor="start" class="t" font-size="12">targeting, gamification and</text><text x="516" y="180" text-anchor="start" class="t" font-size="12">rewards, and how success was</text><text x="516" y="196" text-anchor="start" class="t" font-size="12">measured.</text><line x1="137" y1="280" x2="137" y2="305" class="arb" marker-end="url(#ah-sol-film-2024-q3)"/><line x1="380" y1="280" x2="380" y2="305" class="arg" marker-end="url(#ah-sol-film-2024-q3)"/><line x1="622" y1="280" x2="622" y2="305" class="arr" marker-end="url(#ah-sol-film-2024-q3)"/><rect x="20" y="305" width="720" height="75" rx="10" class="boxi"/><text x="36" y="330" text-anchor="start" class="ti" font-size="13" font-weight="700">Viewpoint (appraise)</text><text x="36" y="352" text-anchor="start" class="t" font-size="12">The campaign was highly effective because the institution matched the platform, technology and</text><text x="36" y="368" text-anchor="start" class="t" font-size="12">incentive to its teenage audience, shown by …</text></svg>
