<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-label="Timeline of Spanish tenses for past, present and future" class="dg"><defs><marker id="ah-spanish-tenses" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs><text x="380" y="26" text-anchor="middle" class="tt" font-size="17" font-weight="700">Which tense? A timeline</text><line x1="30" y1="140" x2="730" y2="140" class="ar" marker-end="url(#ah-spanish-tenses)"/><line x1="380" y1="120" x2="380" y2="160" class="lnb"/><text x="380" y="176" text-anchor="middle" class="tb" font-size="13">NOW</text><rect x="20" y="55" width="200" height="36" rx="8" class="boxr"/><text x="120.0" y="78.0" text-anchor="middle" class="t" font-size="14" font-weight="700">PAST</text><rect x="8" y="195" width="224" height="42" rx="6" class="box"/><text x="120.0" y="221.0" text-anchor="middle" class="t" font-size="11"><tspan x="120.0" y="214.1">preterite: completed</tspan><tspan x="120.0" y="227.9">(trabajé)</tspan></text><rect x="8" y="243" width="224" height="42" rx="6" class="box"/><text x="120.0" y="269.0" text-anchor="middle" class="t" font-size="11"><tspan x="120.0" y="262.1">imperfect: habit or</tspan><tspan x="120.0" y="275.9">background (trabajaba)</tspan></text><rect x="8" y="291" width="224" height="42" rx="6" class="box"/><text x="120.0" y="317.0" text-anchor="middle" class="t" font-size="11"><tspan x="120.0" y="310.1">present perfect: recent,</tspan><tspan x="120.0" y="323.9">linked to now (he trabajado)</tspan></text><rect x="280" y="55" width="200" height="36" rx="8" class="boxg"/><text x="380.0" y="78.0" text-anchor="middle" class="t" font-size="14" font-weight="700">PRESENT</text><rect x="268" y="195" width="224" height="42" rx="6" class="box"/><text x="380.0" y="221.0" text-anchor="middle" class="t" font-size="11"><tspan x="380.0" y="214.1">present: facts, habits,</tspan><tspan x="380.0" y="227.9">opinions (creo que es)</tspan></text><rect x="268" y="243" width="224" height="42" rx="6" class="box"/><text x="380.0" y="269.0" text-anchor="middle" class="t" font-size="11"><tspan x="380.0" y="262.1">estar + gerund: ongoing</tspan><tspan x="380.0" y="275.9">(estoy estudiando)</tspan></text><rect x="268" y="291" width="224" height="42" rx="6" class="box"/><text x="380.0" y="317.0" text-anchor="middle" class="t" font-size="11"><tspan x="380.0" y="310.1">llevar + time + gerund</tspan><tspan x="380.0" y="323.9">(llevo dos años estudiando)</tspan></text><rect x="540" y="55" width="200" height="36" rx="8" class="boxb"/><text x="640.0" y="78.0" text-anchor="middle" class="t" font-size="14" font-weight="700">FUTURE</text><rect x="528" y="195" width="224" height="42" rx="6" class="box"/><text x="640.0" y="221.0" text-anchor="middle" class="t" font-size="11"><tspan x="640.0" y="214.1">ir a + infinitive: plans</tspan><tspan x="640.0" y="227.9">(voy a viajar)</tspan></text><rect x="528" y="243" width="224" height="42" rx="6" class="box"/><text x="640.0" y="269.0" text-anchor="middle" class="t" font-size="11"><tspan x="640.0" y="262.1">future: predictions</tspan><tspan x="640.0" y="275.9">(estudiaré)</tspan></text><rect x="528" y="291" width="224" height="42" rx="6" class="box"/><text x="640.0" y="317.0" text-anchor="middle" class="t" font-size="11"><tspan x="640.0" y="310.1">conditional: wishes, advice</tspan><tspan x="640.0" y="323.9">(me gustaría)</tspan></text><text x="380" y="372" text-anchor="middle" class="t2" font-size="12">Subjunctive (espero que…, cuando termine…) and si-clauses (si tuviera…, haría…) show range.</text></svg>
