<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-label="Flow network with a minimum cut marked" class="dg"><defs><marker id="ah-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs><text x="380" y="26" text-anchor="middle" class="tt" font-size="17" font-weight="700">Flow network: maximum flow = minimum cut</text><line x1="96.09968943799848" y1="161.95015528100075" x2="240.32260179800184" y2="89.83869910099908" class="ar" marker-end="url(#ah-flow)"/><rect x="157.0" y="115.0" width="26" height="20" rx="4" class="box"/><text x="170.0" y="130.0" text-anchor="middle" class="t" font-size="12">10</text><line x1="96.09968943799848" y1="178.04984471899925" x2="240.32260179800184" y2="250.16130089900093" class="ar" marker-end="url(#ah-flow)"/><rect x="157.0" y="205.0" width="26" height="20" rx="4" class="box"/><text x="170.0" y="220.0" text-anchor="middle" class="t" font-size="12">8</text><line x1="260.0" y1="98.0" x2="260.0" y2="238.0" class="ar" marker-end="url(#ah-flow)"/><rect x="247.0" y="160.0" width="26" height="20" rx="4" class="box"/><text x="260.0" y="175.0" text-anchor="middle" class="t" font-size="12">3</text><line x1="276.0996894379985" y1="88.04984471899924" x2="420.32260179800187" y2="160.16130089900093" class="arb" marker-end="url(#ah-flow)"/><rect x="337.0" y="115.0" width="26" height="20" rx="4" class="box"/><text x="350.0" y="130.0" text-anchor="middle" class="t" font-size="12">7</text><line x1="276.0996894379985" y1="251.95015528100075" x2="420.32260179800187" y2="179.83869910099907" class="arb" marker-end="url(#ah-flow)"/><rect x="337.0" y="205.0" width="26" height="20" rx="4" class="box"/><text x="350.0" y="220.0" text-anchor="middle" class="t" font-size="12">9</text><circle cx="80" cy="170" r="17" class="nodeb"/><text x="80" y="175" text-anchor="middle" class="t" font-size="13" font-weight="600">S</text><circle cx="260" cy="80" r="17" class="node"/><text x="260" y="85" text-anchor="middle" class="t" font-size="13" font-weight="600">A</text><circle cx="260" cy="260" r="17" class="node"/><text x="260" y="265" text-anchor="middle" class="t" font-size="13" font-weight="600">B</text><circle cx="440" cy="170" r="17" class="nodeb"/><text x="440" y="175" text-anchor="middle" class="t" font-size="13" font-weight="600">T</text><line x1="310" y1="50" x2="310" y2="300" class="lnr" stroke-dasharray="5 4"/><text x="310" y="315" text-anchor="middle" class="tr" font-size="12">cut {S, A, B} | {T}</text><rect x="500" y="55" width="245" height="240" rx="8" class="box"/><text x="622" y="80" text-anchor="middle" class="tb" font-size="14">Capacity of a cut</text><text x="515" y="108" text-anchor="start" class="t" font-size="12">Add only edges that go FROM</text><text x="515" y="130" text-anchor="start" class="t" font-size="12">the source side TO the sink side.</text><text x="515" y="152" text-anchor="start" class="t" font-size="12"></text><text x="515" y="174" text-anchor="start" class="t" font-size="12">Cut {S}: 10 + 8 = 18</text><text x="515" y="196" text-anchor="start" class="t" font-size="12">Cut {S, A}: 8 + 3 + 7 = 18</text><text x="515" y="218" text-anchor="start" class="t" font-size="12">Cut {S, B}: 10 + 9 = 19</text><text x="515" y="240" text-anchor="start" class="tr" font-size="12">Cut {S, A, B}: 7 + 9 = 16</text><text x="622" y="275" text-anchor="middle" class="tg" font-size="13">Minimum cut 16 = maximum flow 16</text></svg>
