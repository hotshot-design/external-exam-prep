<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-label="User interface, server interface and data interface exchanging requests and data" class="dg"><defs><marker id="ah-data-exchange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs><text x="380" y="26" text-anchor="middle" class="tt" font-size="17" font-weight="700">Data exchange components</text><rect x="25" y="70" width="210" height="60" rx="8" class="boxb"/><text x="130.0" y="105.0" text-anchor="middle" class="t" font-size="15" font-weight="700">User interface</text><rect x="25" y="135" width="210" height="60" rx="6" class="box"/><text x="130.0" y="170.0" text-anchor="middle" class="t" font-size="12"><tspan x="130.0" y="162.5">device, browser, app</tspan><tspan x="130.0" y="177.5">(what the user sees)</tspan></text><rect x="270" y="70" width="210" height="60" rx="8" class="boxy"/><text x="375.0" y="105.0" text-anchor="middle" class="t" font-size="15" font-weight="700">Server interface</text><rect x="270" y="135" width="210" height="60" rx="6" class="box"/><text x="375.0" y="170.0" text-anchor="middle" class="t" font-size="12"><tspan x="375.0" y="162.5">web server handling</tspan><tspan x="375.0" y="177.5">requests and responses</tspan></text><rect x="515" y="70" width="210" height="60" rx="8" class="boxg"/><text x="620.0" y="105.0" text-anchor="middle" class="t" font-size="15" font-weight="700">Data interface</text><rect x="515" y="135" width="210" height="60" rx="6" class="box"/><text x="620.0" y="170.0" text-anchor="middle" class="t" font-size="12"><tspan x="620.0" y="162.5">database / DBMS</tspan><tspan x="620.0" y="177.5">stores and returns data</tspan></text><line x1="235" y1="88" x2="270" y2="88" class="arb" marker-end="url(#ah-data-exchange)"/><line x1="270" y1="112" x2="235" y2="112" class="arb" marker-end="url(#ah-data-exchange)"/><line x1="480" y1="88" x2="515" y2="88" class="arb" marker-end="url(#ah-data-exchange)"/><line x1="515" y1="112" x2="480" y2="112" class="arb" marker-end="url(#ah-data-exchange)"/><text x="252" y="62" text-anchor="middle" class="t2" font-size="11">request</text><text x="497" y="62" text-anchor="middle" class="t2" font-size="11">query</text><text x="380" y="230" text-anchor="middle" class="t2" font-size="12">Data travels in a format (JSON, XML) over a protocol (HTTP, HTTPS, FTP).</text><text x="380" y="250" text-anchor="middle" class="t2" font-size="12">Risks: interception in transit (use TLS/HTTPS), weak login, unvalidated input.</text></svg>
