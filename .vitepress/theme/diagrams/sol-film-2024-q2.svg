<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-label="Mind map of context facts and what to analyse for the Jurassic World question" class="dg"><defs><marker id="ah-sol-film-2024-q2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs><text x="380" y="24" text-anchor="middle" class="tt" font-size="17" font-weight="700">2024 Q2 Technologies: Jurassic World Dominion</text><rect x="190" y="40" width="380" height="34" rx="8" class="boxy"/><text x="380.0" y="62.0" text-anchor="middle" class="t" font-size="13" font-weight="700">Key concept: technologies</text><rect x="20" y="90" width="235" height="190" rx="8" class="boxb"/><text x="32" y="112" text-anchor="start" class="tb" font-size="13" font-weight="700">Context of production</text><text x="32" y="132" text-anchor="start" class="t" font-size="12">Third Jurassic World film,</text><text x="32" y="148" text-anchor="start" class="t" font-size="12">sixth in the series (from</text><text x="32" y="164" text-anchor="start" class="t" font-size="12">1993); director Colin</text><text x="32" y="180" text-anchor="start" class="t" font-size="12">Trevorrow; Universal</text><text x="32" y="196" text-anchor="start" class="t" font-size="12">Pictures. Scene: Claire</text><text x="32" y="212" text-anchor="start" class="t" font-size="12">evades a large blind dinosaur</text><text x="32" y="228" text-anchor="start" class="t" font-size="12">in the trees.</text><rect x="262" y="90" width="235" height="190" rx="8" class="boxg"/><text x="274" y="112" text-anchor="start" class="tg" font-size="13" font-weight="700">Context of use</text><text x="274" y="132" text-anchor="start" class="t" font-size="12">(Inferred, not in the context</text><text x="274" y="148" text-anchor="start" class="t" font-size="12">box) a major franchise</text><text x="274" y="164" text-anchor="start" class="t" font-size="12">release for a broad audience;</text><text x="274" y="180" text-anchor="start" class="t" font-size="12">the clip is online.</text><rect x="504" y="90" width="236" height="190" rx="8" class="box"/><text x="516" y="112" text-anchor="start" class="tr" font-size="13" font-weight="700">Analyse after watching</text><text x="516" y="132" text-anchor="start" class="t" font-size="12">How sound design,</text><text x="516" y="148" text-anchor="start" class="t" font-size="12">CGI/animatronics, camera and</text><text x="516" y="164" text-anchor="start" class="t" font-size="12">editing build tension, and</text><text x="516" y="180" text-anchor="start" class="t" font-size="12">how the audience is</text><text x="516" y="196" text-anchor="start" class="t" font-size="12">positioned alongside Claire.</text><line x1="137" y1="280" x2="137" y2="305" class="arb" marker-end="url(#ah-sol-film-2024-q2)"/><line x1="380" y1="280" x2="380" y2="305" class="arg" marker-end="url(#ah-sol-film-2024-q2)"/><line x1="622" y1="280" x2="622" y2="305" class="arr" marker-end="url(#ah-sol-film-2024-q2)"/><rect x="20" y="305" width="720" height="75" rx="10" class="boxi"/><text x="36" y="330" text-anchor="start" class="ti" font-size="13" font-weight="700">Viewpoint (appraise)</text><text x="36" y="352" text-anchor="start" class="t" font-size="12">Technologies such as … build tension effectively by … (a blind predator suggests sound and</text><text x="36" y="368" text-anchor="start" class="t" font-size="12">silence).</text></svg>
