<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" role="img" aria-label="Four business criteria with meanings" class="dg"><defs><marker id="ah-criteria" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs><text x="380" y="26" text-anchor="middle" class="tt" font-size="17" font-weight="700">The four business criteria (syllabus)</text><rect x="20" y="55" width="170" height="60" rx="8" class="boxb"/><text x="105.0" y="90.0" text-anchor="middle" class="t" font-size="14" font-weight="700">Competitiveness</text><rect x="20" y="120" width="170" height="76" rx="6" class="box"/><text x="105.0" y="163.0" text-anchor="middle" class="t" font-size="12"><tspan x="105.0" y="148.0">meets or exceeds</tspan><tspan x="105.0" y="163.0">market standards</tspan><tspan x="105.0" y="178.0">vs rivals</tspan></text><rect x="205" y="55" width="170" height="60" rx="8" class="boxg"/><text x="290.0" y="90.0" text-anchor="middle" class="t" font-size="14" font-weight="700">Effectiveness</text><rect x="205" y="120" width="170" height="76" rx="6" class="box"/><text x="290.0" y="163.0" text-anchor="middle" class="t" font-size="12"><tspan x="290.0" y="148.0">goals achieved and</tspan><tspan x="290.0" y="163.0">target problems</tspan><tspan x="290.0" y="178.0">solved</tspan></text><rect x="390" y="55" width="170" height="60" rx="8" class="boxy"/><text x="475.0" y="90.0" text-anchor="middle" class="t" font-size="14" font-weight="700">Efficiency</text><rect x="390" y="120" width="170" height="76" rx="6" class="box"/><text x="475.0" y="163.0" text-anchor="middle" class="t" font-size="12"><tspan x="475.0" y="148.0">best use of</tspan><tspan x="475.0" y="163.0">resources and</tspan><tspan x="475.0" y="178.0">processes</tspan></text><rect x="575" y="55" width="170" height="60" rx="8" class="boxi"/><text x="660.0" y="90.0" text-anchor="middle" class="t" font-size="14" font-weight="700"><tspan x="660.0" y="81.2">Stakeholder</tspan><tspan x="660.0" y="98.8">satisfaction</tspan></text><rect x="575" y="120" width="170" height="76" rx="6" class="box"/><text x="660.0" y="163.0" text-anchor="middle" class="t" font-size="12"><tspan x="660.0" y="148.0">expectations</tspan><tspan x="660.0" y="163.0">considered</tspan><tspan x="660.0" y="178.0">and managed</tspan></text><text x="380" y="225" text-anchor="middle" class="t2" font-size="12">Choose TWO. Judge the strategy against each: 'to what degree …?'</text></svg>
