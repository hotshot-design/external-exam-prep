<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-label="Production contexts and use contexts side by side" class="dg"><defs><marker id="ah-film-contexts" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs><text x="380" y="26" text-anchor="middle" class="tt" font-size="17" font-weight="700">Contexts of production and use (6 of 32 marks)</text><rect x="20" y="55" width="350" height="36" rx="8" class="boxb"/><text x="195.0" y="78.0" text-anchor="middle" class="t" font-size="14" font-weight="700">PRODUCTION: how it was made</text><rect x="390" y="55" width="350" height="36" rx="8" class="boxg"/><text x="565.0" y="78.0" text-anchor="middle" class="t" font-size="14" font-weight="700">USE: how it reaches and is used by audiences</text><rect x="20" y="100" width="350" height="40" rx="6" class="box"/><text x="195.0" y="125.0" text-anchor="middle" class="t" font-size="12">who made it, when, where, why</text><rect x="20" y="148" width="350" height="40" rx="6" class="box"/><text x="195.0" y="173.0" text-anchor="middle" class="t" font-size="12">public or commercial funding / commissioning</text><rect x="20" y="196" width="350" height="40" rx="6" class="box"/><text x="195.0" y="221.0" text-anchor="middle" class="t" font-size="12">technologies available (CGI, AR, animation)</text><rect x="20" y="244" width="350" height="40" rx="6" class="box"/><text x="195.0" y="269.0" text-anchor="middle" class="t" font-size="12">distribution and regulation</text><rect x="390" y="100" width="350" height="40" rx="6" class="box"/><text x="565.0" y="125.0" text-anchor="middle" class="t" font-size="12">who it is made for (target audience)</text><rect x="390" y="148" width="350" height="40" rx="6" class="box"/><text x="565.0" y="173.0" text-anchor="middle" class="t" font-size="12">platform and viewing context (e.g. YouTube)</text><rect x="390" y="196" width="350" height="40" rx="6" class="box"/><text x="565.0" y="221.0" text-anchor="middle" class="t" font-size="12">why and how audiences use it (share, buy, learn)</text><rect x="390" y="244" width="350" height="40" rx="6" class="box"/><text x="565.0" y="269.0" text-anchor="middle" class="t" font-size="12">outcome: views, awards, sales</text><text x="380" y="315" text-anchor="middle" class="t2" font-size="12">The context box in the exam gives most of these facts. Write production and use SEPARATELY,</text><text x="380" y="335" text-anchor="middle" class="t2" font-size="12">then link each to the key concept in the question.</text></svg>
