<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-label="Mind map of context facts and what to analyse for the animation question" class="dg"><defs><marker id="ah-sol-film-2025-q2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs><text x="380" y="24" text-anchor="middle" class="tt" font-size="17" font-weight="700">2025 Q2 Representations: The Last Job on Earth</text><rect x="190" y="40" width="380" height="34" rx="8" class="boxy"/><text x="380.0" y="62.0" text-anchor="middle" class="t" font-size="13" font-weight="700">Key concept: representations</text><rect x="20" y="90" width="235" height="190" rx="8" class="boxb"/><text x="32" y="112" text-anchor="start" class="tb" font-size="13" font-weight="700">Context of production</text><text x="32" y="132" text-anchor="start" class="t" font-size="12">Animation by Moth Collective,</text><text x="32" y="148" text-anchor="start" class="t" font-size="12">funded by the DOEN Foundation</text><text x="32" y="164" text-anchor="start" class="t" font-size="12">(green, socially inclusive,</text><text x="32" y="180" text-anchor="start" class="t" font-size="12">creative innovation). Idea:</text><text x="32" y="196" text-anchor="start" class="t" font-size="12">Paul Mason's “biggest enigma”</text><text x="32" y="212" text-anchor="start" class="t" font-size="12">of a post-work society.</text><rect x="262" y="90" width="235" height="190" rx="8" class="boxg"/><text x="274" y="112" text-anchor="start" class="tg" font-size="13" font-weight="700">Context of use</text><text x="274" y="132" text-anchor="start" class="t" font-size="12">Published with a Guardian</text><text x="274" y="148" text-anchor="start" class="t" font-size="12">article on a post-work</text><text x="274" y="164" text-anchor="start" class="t" font-size="12">society, in its sustainable</text><text x="274" y="180" text-anchor="start" class="t" font-size="12">business section. Over two-</text><text x="274" y="196" text-anchor="start" class="t" font-size="12">thirds of readers are 35 or</text><text x="274" y="212" text-anchor="start" class="t" font-size="12">older.</text><rect x="504" y="90" width="236" height="190" rx="8" class="box"/><text x="516" y="112" text-anchor="start" class="tr" font-size="13" font-weight="700">Analyse after watching</text><text x="516" y="132" text-anchor="start" class="t" font-size="12">How ideas about the future</text><text x="516" y="148" text-anchor="start" class="t" font-size="12">are represented (identity</text><text x="516" y="164" text-anchor="start" class="t" font-size="12">beyond corporate identity,</text><text x="516" y="180" text-anchor="start" class="t" font-size="12">skill set, seniority). Tie</text><text x="516" y="196" text-anchor="start" class="t" font-size="12">every point to an older</text><text x="516" y="212" text-anchor="start" class="t" font-size="12">business-news audience.</text><line x1="137" y1="280" x2="137" y2="305" class="arb" marker-end="url(#ah-sol-film-2025-q2)"/><line x1="380" y1="280" x2="380" y2="305" class="arg" marker-end="url(#ah-sol-film-2025-q2)"/><line x1="622" y1="280" x2="622" y2="305" class="arr" marker-end="url(#ah-sol-film-2025-q2)"/><rect x="20" y="305" width="720" height="75" rx="10" class="boxi"/><text x="36" y="330" text-anchor="start" class="ti" font-size="13" font-weight="700">Viewpoint (appraise)</text><text x="36" y="352" text-anchor="start" class="t" font-size="12">The animation represents the future as … effectively/ineffectively because … (link to the</text><text x="36" y="368" text-anchor="start" class="t" font-size="12">article's message: do not fear a post-work society).</text></svg>
