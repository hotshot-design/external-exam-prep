<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-label="Wheel graph with six vertices, ten edges and six faces" class="dg"><defs><marker id="ah-ex-10-wheel" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs><text x="380" y="24" text-anchor="middle" class="tt" font-size="17" font-weight="700">Example 10: planar graph with v = 6, e = 10, so f = 6</text><line x1="200.0" y1="70.0" x2="299.8609342109911" y2="142.55321559063051" class="ln"/><line x1="299.8609342109911" y1="142.55321559063051" x2="261.71745149070966" y2="259.94678440936946" class="ln"/><line x1="261.71745149070966" y1="259.94678440936946" x2="138.28254850929034" y2="259.94678440936946" class="ln"/><line x1="138.28254850929034" y1="259.94678440936946" x2="100.13906578900887" y2="142.55321559063054" class="ln"/><line x1="100.13906578900887" y1="142.55321559063054" x2="200.0" y2="70.0" class="ln"/><line x1="200" y1="175" x2="200.0" y2="70.0" class="ln"/><line x1="200" y1="175" x2="299.8609342109911" y2="142.55321559063051" class="ln"/><line x1="200" y1="175" x2="261.71745149070966" y2="259.94678440936946" class="ln"/><line x1="200" y1="175" x2="138.28254850929034" y2="259.94678440936946" class="ln"/><line x1="200" y1="175" x2="100.13906578900887" y2="142.55321559063054" class="ln"/><circle cx="200" cy="175" r="14" class="node"/><circle cx="200" cy="175" r="14" class="nodeb"/><text x="200" y="180" text-anchor="middle" class="t" font-size="12" font-weight="600">H</text><circle cx="200.0" cy="70.0" r="14" class="node"/><text x="200.0" y="75.0" text-anchor="middle" class="t" font-size="12" font-weight="600">1</text><circle cx="299.8609342109911" cy="142.55321559063051" r="14" class="node"/><text x="299.8609342109911" y="147.55321559063051" text-anchor="middle" class="t" font-size="12" font-weight="600">2</text><circle cx="261.71745149070966" cy="259.94678440936946" r="14" class="node"/><text x="261.71745149070966" y="264.94678440936946" text-anchor="middle" class="t" font-size="12" font-weight="600">3</text><circle cx="138.28254850929034" cy="259.94678440936946" r="14" class="node"/><text x="138.28254850929034" y="264.94678440936946" text-anchor="middle" class="t" font-size="12" font-weight="600">4</text><circle cx="100.13906578900887" cy="142.55321559063054" r="14" class="node"/><text x="100.13906578900887" y="147.55321559063054" text-anchor="middle" class="t" font-size="12" font-weight="600">5</text><rect x="380" y="55" width="365" height="240" rx="8" class="boxb"/><text x="395" y="85" text-anchor="start" class="tb" font-size="13">v + f − e = 2</text><text x="395" y="111" text-anchor="start" class="t" font-size="13">f = 2 + e − v = 2 + 10 − 6 = 6</text><text x="395" y="137" text-anchor="start" class="t2" font-size="13">5 triangles + the outside = 6 faces</text><text x="395" y="163" text-anchor="start" class="t" font-size="13"></text><text x="395" y="189" text-anchor="start" class="t" font-size="13">Eulerian circuit: connected and every</text><text x="395" y="215" text-anchor="start" class="t" font-size="13">vertex has an even degree</text><text x="395" y="241" text-anchor="start" class="t" font-size="13">Eulerian trail: exactly two odd vertices</text><text x="395" y="267" text-anchor="start" class="t2" font-size="13">(this wheel has none, so neither exists)</text></svg>
