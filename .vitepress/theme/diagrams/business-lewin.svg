<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-label="Lewin's unfreeze, change, refreeze stages with example actions" class="dg"><defs><marker id="ah-lewin" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs><text x="380" y="28" text-anchor="middle" class="tt" font-size="17" font-weight="700">Lewin's 3-stage change model</text><rect x="30" y="55" width="200" height="40" rx="8" class="boxr"/><text x="130.0" y="80.0" text-anchor="middle" class="tr" font-size="14" font-weight="700">UNFREEZE</text><rect x="30" y="105" width="200" height="130" rx="8" class="box"/><text x="130" y="132" text-anchor="middle" class="t" font-size="13">Show why change is needed</text><text x="130" y="170" text-anchor="middle" class="t" font-size="13">Reduce resistance</text><text x="130" y="208" text-anchor="middle" class="t" font-size="13">Communicate and involve staff</text><line x1="230" y1="75" x2="270" y2="75" class="ar" marker-end="url(#ah-lewin)"/><rect x="270" y="55" width="200" height="40" rx="8" class="boxy"/><text x="370.0" y="80.0" text-anchor="middle" class="ty" font-size="14" font-weight="700">CHANGE</text><rect x="270" y="105" width="200" height="130" rx="8" class="box"/><text x="370" y="132" text-anchor="middle" class="t" font-size="13">Implement new processes</text><text x="370" y="170" text-anchor="middle" class="t" font-size="13">Train and support staff</text><text x="370" y="208" text-anchor="middle" class="t" font-size="13">Monitor progress</text><line x1="470" y1="75" x2="510" y2="75" class="ar" marker-end="url(#ah-lewin)"/><rect x="510" y="55" width="200" height="40" rx="8" class="boxg"/><text x="610.0" y="80.0" text-anchor="middle" class="tg" font-size="14" font-weight="700">REFREEZE</text><rect x="510" y="105" width="200" height="130" rx="8" class="box"/><text x="610" y="132" text-anchor="middle" class="t" font-size="13">KPIs and reward system</text><text x="610" y="170" text-anchor="middle" class="t" font-size="13">New structure for new processes</text><text x="610" y="208" text-anchor="middle" class="t" font-size="13"><tspan x="610" y="199.9">Feedback system</tspan><tspan x="610" y="216.1">(e.g. surveys)</tspan></text><text x="380" y="270" text-anchor="middle" class="t2" font-size="12">Refreeze embeds the change so it becomes normal operations; without it old behaviour can return (2023 guide).</text></svg>
