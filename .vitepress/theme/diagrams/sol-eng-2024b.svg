<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-label="Thesis and three paragraphs for the handkerchief prompt" class="dg"><defs><marker id="ah-sol-eng-2024b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs><text x="380" y="24" text-anchor="middle" class="tt" font-size="17" font-weight="700">2024 (b): the handkerchief</text><rect x="20" y="40" width="720" height="38" rx="8" class="boxy"/><text x="34" y="64" text-anchor="start" class="t" font-size="12">Analyse the significance of Desdemona's handkerchief in the play.</text><rect x="20" y="90" width="720" height="76" rx="10" class="boxi"/><text x="34" y="112" text-anchor="start" class="ti" font-size="13" font-weight="700">Thesis</text><text x="34" y="132" text-anchor="start" class="t" font-size="12">The handkerchief is the central symbol: a love token Iago converts into “ocular proof”, showing</text><text x="34" y="148" text-anchor="start" class="t" font-size="12">objects replacing people as evidence and women treated as property.</text><line x1="132" y1="166" x2="132" y2="186" class="arb" marker-end="url(#ah-sol-eng-2024b)"/><rect x="20" y="186" width="230" height="220" rx="8" class="box"/><text x="32" y="208" text-anchor="start" class="tb" font-size="12" font-weight="700">Paragraph 1</text><text x="32" y="228" text-anchor="start" class="tb" font-size="12">Symbol of love and bond</text><text x="32" y="252" text-anchor="start" class="t" font-size="11">“That handkerchief / Did an</text><text x="32" y="267" text-anchor="start" class="t" font-size="11">Egyptian to my mother give”</text><text x="32" y="282" text-anchor="start" class="t" font-size="11">(3.4): exotic, sacred origins</text><text x="32" y="305" text-anchor="start" class="t2" font-size="11">Context: Othello treats the</text><text x="32" y="320" text-anchor="start" class="t2" font-size="11">gift as a ritual guarantee of</text><text x="32" y="335" text-anchor="start" class="t2" font-size="11">fidelity</text><line x1="377" y1="166" x2="377" y2="186" class="arb" marker-end="url(#ah-sol-eng-2024b)"/><rect x="265" y="186" width="230" height="220" rx="8" class="box"/><text x="277" y="208" text-anchor="start" class="tb" font-size="12" font-weight="700">Paragraph 2</text><text x="277" y="228" text-anchor="start" class="tb" font-size="12">Iago's tool: trifle becomes</text><text x="277" y="244" text-anchor="start" class="tb" font-size="12">proof</text><text x="277" y="268" text-anchor="start" class="t" font-size="11">Iago will “in Cassio's lodging</text><text x="277" y="283" text-anchor="start" class="t" font-size="11">lose this napkin” (3.3);</text><text x="277" y="298" text-anchor="start" class="t" font-size="11">“ocular proof”</text><text x="277" y="321" text-anchor="start" class="t2" font-size="11">Context: the more empty the</text><text x="277" y="336" text-anchor="start" class="t2" font-size="11">sign, the more it controls</text><line x1="622" y1="166" x2="622" y2="186" class="arb" marker-end="url(#ah-sol-eng-2024b)"/><rect x="510" y="186" width="230" height="220" rx="8" class="box"/><text x="522" y="208" text-anchor="start" class="tb" font-size="12" font-weight="700">Paragraph 3</text><text x="522" y="228" text-anchor="start" class="tb" font-size="12">Collapse of Othello's</text><text x="522" y="244" text-anchor="start" class="tb" font-size="12">language</text><text x="522" y="268" text-anchor="start" class="t" font-size="11">“Handkerchief—confessions—handk</text><text x="522" y="283" text-anchor="start" class="t" font-size="11">erchief!” (4.1): fragmented</text><text x="522" y="298" text-anchor="start" class="t" font-size="11">prose; Bianca flings it</text><text x="522" y="321" text-anchor="start" class="t2" font-size="11">Context: stands in for</text><text x="522" y="336" text-anchor="start" class="t2" font-size="11">Desdemona's chastity:</text><text x="522" y="351" text-anchor="start" class="t2" font-size="11">objectification</text></svg>
