<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-label="Conclusion and three examples for the 2024 Q2 voicemail answer" class="dg"><defs><marker id="ah-sol-es-2024-q2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs><text x="380" y="24" text-anchor="middle" class="tt" font-size="17" font-weight="700">2024 Q2: purpose of the call (8 marks)</text><rect x="20" y="40" width="720" height="40" rx="8" class="boxy"/><text x="34" y="64" text-anchor="start" class="t" font-size="12">¿Cuál es el propósito de la llamada? Tres ejemplos.</text><rect x="110" y="100" width="540" height="60" rx="10" class="boxb"/><text x="126" y="122" text-anchor="start" class="tb" font-size="13" font-weight="700">Conclusion (1 mark)</text><text x="126" y="142" text-anchor="start" class="t" font-size="12">To change her reservation.</text><line x1="136.0" y1="160" x2="136.0" y2="186" class="arb" marker-end="url(#ah-sol-es-2024-q2)"/><rect x="20.0" y="186" width="232.0" height="90" rx="8" class="boxg"/><text x="30.0" y="206" text-anchor="start" class="tg" font-size="12" font-weight="700">Example 1 (1)</text><text x="30.0" y="224" text-anchor="start" class="t" font-size="11">Change the time of the dinner.</text><line x1="380.0" y1="160" x2="380.0" y2="186" class="arb" marker-end="url(#ah-sol-es-2024-q2)"/><rect x="264.0" y="186" width="232.0" height="90" rx="8" class="boxg"/><text x="274.0" y="206" text-anchor="start" class="tg" font-size="12" font-weight="700">Example 2 (1)</text><text x="274.0" y="224" text-anchor="start" class="t" font-size="11">Sit in the garden.</text><line x1="624.0" y1="160" x2="624.0" y2="186" class="arb" marker-end="url(#ah-sol-es-2024-q2)"/><rect x="508.0" y="186" width="232.0" height="90" rx="8" class="boxg"/><text x="518.0" y="206" text-anchor="start" class="tg" font-size="12" font-weight="700">Example 3 (1)</text><text x="518.0" y="224" text-anchor="start" class="t" font-size="11">Add a high chair for her one-</text><text x="518.0" y="239" text-anchor="start" class="t" font-size="11">year-old cousin.</text><text x="380" y="306" text-anchor="middle" class="t2" font-size="11">+ 4 marks for your Spanish: 4 few errors · 3 some · 2 words/phrases · 1 fragmented.</text></svg>
