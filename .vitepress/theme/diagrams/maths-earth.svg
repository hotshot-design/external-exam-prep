<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 352" role="img" aria-label="Side view of a meridian with latitudes and distance formulas" class="dg"><defs><marker id="ah-earth" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs><text x="380" y="26" text-anchor="middle" class="tt" font-size="17" font-weight="700">Earth geometry: latitude, longitude and distance</text><circle cx="170" cy="185" r="120" class="box"/><line x1="50" y1="185" x2="290" y2="185" class="ln"/><text x="296" y="189" text-anchor="start" class="t2" font-size="11">equator</text><text x="170" y="55" text-anchor="middle" class="t2">N</text><text x="170" y="322" text-anchor="middle" class="t2">S</text><line x1="170" y1="185" x2="276.9207829026042" y2="239.4788599687456" class="lnb"/><circle cx="276.9207829026042" cy="239.4788599687456" r="5" class="dot"/><text x="284.9207829026042" y="243.4788599687456" text-anchor="start" class="tb" font-size="12">27° S</text><line x1="170" y1="185" x2="265.83626120567516" y2="257.2178027782458" class="lnb"/><circle cx="265.83626120567516" cy="257.2178027782458" r="5" class="dot"/><text x="273.83626120567516" y="273.2178027782458" text-anchor="start" class="tb" font-size="12">37° S</text><path d="M 230 185 A 60 60 0 0 1 223.4603914513021 212.2394299843728" class="lng"/><path d="M 250.1905871769531 225.8591449765592 A 90 90 0 0 1 241.87719590425635 239.16335208368434" class="lnr"/><text x="210" y="255" text-anchor="middle" class="tr" font-size="13">10°</text><text x="238" y="207" text-anchor="middle" class="tg" font-size="12">27°</text><text x="170" y="344" text-anchor="middle" class="t2" font-size="11">side view along one meridian</text><rect x="360" y="55" width="370" height="80" rx="8" class="boxb"/><text x="545" y="78" text-anchor="middle" class="tb" font-size="14">Same meridian (north–south)</text><text x="545" y="104" text-anchor="middle" class="t" font-size="14">D = 111.2 × angular distance</text><text x="545" y="124" text-anchor="middle" class="t2" font-size="12">27° S to 37° S: 10° → 1112 km</text><rect x="360" y="145" width="370" height="80" rx="8" class="boxg"/><text x="545" y="168" text-anchor="middle" class="tg" font-size="14">Same parallel (east–west)</text><text x="545" y="194" text-anchor="middle" class="t" font-size="14">D = 111.2 × cos(latitude) × angular distance</text><text x="545" y="214" text-anchor="middle" class="t2" font-size="12">cos only for east–west distances</text><rect x="360" y="235" width="370" height="80" rx="8" class="boxy"/><text x="545" y="258" text-anchor="middle" class="ty" font-size="14">Opposite hemispheres: ADD the angles</text><text x="545" y="284" text-anchor="middle" class="t" font-size="14">18.7° N and 12.4° S → 31.1°</text><text x="545" y="304" text-anchor="middle" class="t2" font-size="12">same hemisphere: subtract</text></svg>
